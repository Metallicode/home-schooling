<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Paper-Space Engine</title>
    <style>
        /* --- HYBRID NEON-BRUTALIST AESTHETIC --- */
        :root {
            --bg-color: #050508; 
            --text-blue: #00e5ff; /* Neon Cyan */
            --text-pink: #ff4081; /* Neon Magenta */
            --text-yellow: #ffeb3b; /* Neon Yellow */
            --highlight-bg: #fff; /* Stark white for active focus */
        }

        body { 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: var(--bg-color); color: #fff;
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box;
            text-align: center;
        }

        h1 { color: var(--text-yellow); text-shadow: 0 0 15px rgba(255, 235, 59, 0.5); margin: 0 0 5px 0; letter-spacing: 2px;}
        p { font-size: 16px; color: #b2ebf2; margin: 0 0 30px 0; max-width: 800px;}

        /* --- DASHBOARD CONTROLS --- */
        .controls {
            display: flex; gap: 15px; background: #111; padding: 15px 30px; 
            border-radius: 15px; flex-wrap: wrap; justify-content: center; align-items: center;
            border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px;
            z-index: 10;
        }

        input[type="number"] {
            background: #0a0a0d; border: 2px solid #333; border-radius: 8px;
            padding: 10px; font-size: 24px; color: var(--text-blue); font-weight: bold;
            width: 120px; text-align: center; outline: none; font-family: inherit;
            transition: all 0.2s;
        }
        input[type="number"]:focus { border-color: var(--text-blue); box-shadow: 0 0 10px rgba(0,229,255,0.3); }
        
        select {
            background: #222; color: var(--text-pink); border: 2px solid #333;
            border-radius: 8px; padding: 10px 15px; font-size: 24px; font-weight: bold;
            cursor: pointer; outline: none; font-family: inherit; transition: all 0.2s;
        }
        select:focus { border-color: var(--text-pink); box-shadow: 0 0 10px rgba(255,64,129,0.3); }

        .btn {
            background: #222; color: #fff; border: 2px solid #444; border-radius: 8px;
            padding: 12px 25px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.1s;
            font-family: inherit; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { background: #333; border-color: var(--text-blue); color: var(--text-blue); }
        .btn:active { transform: scale(0.95); }

        .speed-control { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #888; font-size: 14px;}
        input[type="range"] { accent-color: var(--text-blue); cursor: pointer; }

        /* --- THE STAGE & GRID --- */
        .stage {
            width: 100%; min-height: 500px; background: #0a0a0d; border-radius: 15px; 
            border: 1px solid #222; box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden; padding: 40px; box-sizing: border-box;
        }

        /* The Paper Grid - Massive Typography */
        .paper-grid {
            display: grid; gap: 0px; 
            font-size: min(10vw, 90px); /* Massive text scaling with viewport */
            font-weight: bold; cursor: pointer;
            transition: transform 0.2s; padding: 20px;
        }
        .paper-grid:hover { transform: scale(1.02); }
        .paper-grid.playing { cursor: default; }
        .paper-grid.playing:hover { transform: scale(1); }

        .cell {
            width: 1em; height: 1.1em; display: flex; justify-content: center; align-items: center;
            color: var(--text-blue); transition: all 0.2s; position: relative; box-sizing: border-box;
            text-shadow: 0 0 15px rgba(0,229,255,0.4);
        }
        
        /* Cell Specifics */
        .cell.carry { font-size: 0.35em; height: 1em; align-items: flex-end; color: var(--text-yellow); text-shadow: 0 0 10px rgba(255,235,59,0.6); padding-bottom: 0.2em;}
        .cell.operator { color: var(--text-pink); text-shadow: 0 0 15px rgba(255,64,129,0.5); align-items: flex-end; padding-bottom: 0.1em; padding-right: 0.2em;}
        
        /* Thick Solid Line */
        .cell.line-cell { border-bottom: 0.08em solid var(--text-blue); height: 0.3em; margin-bottom: 0.1em; box-shadow: 0 10px 10px -10px rgba(0,229,255,0.5); text-shadow: none;}
        
        .cell.hidden { opacity: 0; }
        .cell.visible { opacity: 1; }
        
        /* High-Contrast Animation Highlights */
        .cell.highlight-src { 
            background: var(--highlight-bg); color: #000;
            border-radius: 12px; box-shadow: 0 0 20px #fff;
            text-shadow: none; z-index: 2;
        }
        .cell.highlight-dest { 
            color: var(--text-pink); text-shadow: 0 0 20px rgba(255,64,129,0.8);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cell.highlight-carry { 
            animation: floatUp 0.3s ease-out;
        }

        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes floatUp { 0% { transform: translateY(1em); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        /* --- EXPLAINER BOX --- */
        .explainer-box {
            position: absolute; bottom: 30px; background: #111;
            border: 1px solid #333; padding: 15px 30px; border-radius: 30px;
            font-size: 22px; color: var(--text-yellow); box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
            letter-spacing: 1px; font-weight: bold; text-align: center;
        }
        .explainer-box.show { opacity: 1; }

    </style>
</head>
<body>

<a href="index.html" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(10,10,13,0.9);border:2px solid #00e5ff;border-radius:50px;padding:6px 16px;font-family:'Courier New',Courier,monospace;font-size:0.85rem;font-weight:bold;color:#00e5ff;text-decoration:none;box-shadow:0 0 15px rgba(0,229,255,0.35);white-space:nowrap;" title="Back to Index">🏠 Back to Index</a>

    <h1>📝 The Paper-Space Engine 📝</h1>
    <p>Watch the invisible steps of math become visible. Click the giant numbers to start the algorithm.</p>

    <!-- DASHBOARD CONTROLS -->
    <div class="controls">
        <input type="number" id="input-n1" value="345" min="0" max="9999" onchange="setupProblem()">
        <select id="input-op" onchange="setupProblem()">
            <option value="*">×</option>
            <option value="+">+</option>
        </select>
        <input type="number" id="input-n2" value="65" min="0" max="9999" onchange="setupProblem()">
        
        <button class="btn" onclick="setupProblem()">Reset Grid</button>
        
        <div class="speed-control" style="margin-left: 20px;">
            Speed: 
            <input type="range" id="speed-slider" min="300" max="2000" value="1000" dir="rtl">
        </div>
    </div>

    <!-- THE STAGE -->
    <div class="stage" id="stage">
        
        <!-- The Grid (Click to play) -->
        <div class="paper-grid" id="paper-grid" onclick="startAlgorithm()" title="Click to solve!">
            <!-- Cells generated by JS -->
        </div>

        <!-- Explainer -->
        <div class="explainer-box" id="explainer">5 × 5 = 25. Write 5, carry 2.</div>

    </div>

<script>
    // --- AUDIO ENGINE ---
    let audioCtx;
    
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        initAudio();
        
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'tick') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'write') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'carry') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(1046.5, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'done') {
            osc.type = 'square';
            [523.25, 659.25, 783.99].forEach((freq, i) => {
                let o = audioCtx.createOscillator(); let g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination); o.type = 'triangle';
                o.frequency.setValueAtTime(freq, audioCtx.currentTime + (i*0.1));
                g.gain.setValueAtTime(0.1, audioCtx.currentTime + (i*0.1));
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (i*0.1) + 0.4);
                o.start(audioCtx.currentTime + (i*0.1)); o.stop(audioCtx.currentTime + (i*0.1) + 0.4);
            });
        }
    }

    // --- ALGORITHM STATE ---
    let currentOp = '*';
    let num1 = "345";
    let num2 = "65";
    
    let gridCols = 0;
    let gridRows = 0;
    let steps = [];
    let currentStepIdx = 0;
    let playInterval;
    let isPlaying = false;

    // A virtual representation to map the HTML grid
    let virtualGrid = []; 
    function getCellVal(r, c) { return virtualGrid[r] && virtualGrid[r][c] !== undefined ? virtualGrid[r][c] : ''; }

    // --- INITIALIZATION ---
    function setupProblem() {
        clearInterval(playInterval);
        isPlaying = false;
        document.getElementById('paper-grid').classList.remove('playing');
        document.getElementById('explainer').classList.remove('show');
        
        num1 = document.getElementById('input-n1').value || "0";
        num2 = document.getElementById('input-n2').value || "0";
        currentOp = document.getElementById('input-op').value;

        if (currentOp === '+') compileAddition();
        else if (currentOp === '*') compileMultiplication();
        
        resetGridVisuals();
    }

    function startAlgorithm() {
        if (isPlaying) return; 
        initAudio(); // Unlock browser audio
        
        isPlaying = true;
        document.getElementById('paper-grid').classList.add('playing');
        
        currentStepIdx = 0;
        executeStep();
        
        let speed = parseInt(document.getElementById('speed-slider').value);
        playInterval = setInterval(executeStep, speed);
    }

    // Adjust speed live
    document.getElementById('speed-slider').addEventListener('change', (e) => {
        if (isPlaying) {
            clearInterval(playInterval);
            playInterval = setInterval(executeStep, parseInt(e.target.value));
        }
    });

    // --- COMPILERS (Math Logic) ---
    function compileAddition() {
        steps = [];
        const len1 = num1.length;
        const len2 = num2.length;
        
        gridCols = Math.max(len1, len2) + 1; // +1 for carry/overflow
        gridRows = 5; // Rows: 0:Carry, 1:N1, 2:N2(with op), 3:Line, 4:Result
        
        buildDOMGrid();

        const n1Arr = num1.padStart(gridCols, ' ');
        const n2Arr = num2.padStart(gridCols, ' ');
        
        for(let c=0; c<gridCols; c++) {
            if(n1Arr[c] !== ' ') setCell(1, c, n1Arr[c], 'visible');
            if(n2Arr[c] !== ' ') setCell(2, c, n2Arr[c], 'visible');
        }
        
        let opCol = gridCols - Math.max(len1, len2) - 1;
        setCell(2, opCol, '+', 'visible operator');
        
        for(let c = opCol; c < gridCols; c++) {
            setCell(3, c, '', 'visible line-cell');
        }

        let carry = 0;
        let c = gridCols - 1; 
        
        while (c >= 0) {
            let d1 = n1Arr[c] !== ' ' ? parseInt(n1Arr[c]) : 0;
            let d2 = n2Arr[c] !== ' ' ? parseInt(n2Arr[c]) : 0;
            
            if (n1Arr[c] === ' ' && n2Arr[c] === ' ' && carry === 0) break;

            let sum = d1 + d2 + carry;
            let write = sum % 10;
            let nextCarry = Math.floor(sum / 10);

            let highlightSrc = [];
            if (n1Arr[c] !== ' ') highlightSrc.push([1, c]);
            if (n2Arr[c] !== ' ') highlightSrc.push([2, c]);
            if (carry > 0) highlightSrc.push([0, c]); 

            let msg = `${d1} + ${d2}`;
            if (carry > 0) msg += ` + ${carry} (carry)`;
            msg += ` = ${sum}.`;
            if (nextCarry > 0) msg += ` Write ${write}, carry ${nextCarry}.`;

            steps.push({
                type: 'calc',
                src: highlightSrc,
                write: { r: 4, c: c, val: write },
                carryOut: nextCarry > 0 ? { r: 0, c: c-1, val: nextCarry } : null,
                msg: msg
            });

            carry = nextCarry;
            c--;
        }
        steps.push({ type: 'done', msg: "Addition Complete!" });
    }

    function compileMultiplication() {
        steps = [];
        const len1 = num1.length;
        const len2 = num2.length;

        gridCols = len1 + len2 + 1;

        const partialStartRow = 4;
        // A single partial product IS the final answer - no addition phase needed.
        const needsAddition = len2 > 1;
        // Dedicated row for the addition phase's own carries, kept separate from the
        // last partial product's row so writing a carry can't clobber a digit of it.
        const addCarryRow = partialStartRow + len2;
        const secondLineRow = needsAddition ? addCarryRow + 1 : partialStartRow;
        const finalResultRow = needsAddition ? secondLineRow + 1 : partialStartRow;
        gridRows = finalResultRow + 1;

        buildDOMGrid();

        const n1Arr = num1.padStart(gridCols, ' ');
        const n2Arr = num2.padStart(gridCols, ' ');
        
        for(let c=0; c<gridCols; c++) {
            if(n1Arr[c] !== ' ') setCell(1, c, n1Arr[c], 'visible');
            if(n2Arr[c] !== ' ') setCell(2, c, n2Arr[c], 'visible');
        }
        
        let opCol = gridCols - Math.max(len1, len2) - 1;
        setCell(2, opCol, '×', 'visible operator');
        
        for(let c = opCol; c < gridCols; c++) {
            setCell(3, c, '', 'visible line-cell');
        }

        let partialResults = [];
        // Mirrors what each cell WILL contain once its step actually executes, so the
        // final addition phase (computed here, at compile time, before any of that has
        // happened on screen) can still know each partial product's digits.
        let plannedGrid = {};
        function planCell(r, c, val) { plannedGrid[`${r},${c}`] = String(val); }
        function getPlanned(r, c) { const v = plannedGrid[`${r},${c}`]; return v === undefined ? '' : v; }

        for (let b = 0; b < len2; b++) {
            let bottomDigit = parseInt(num2[len2 - 1 - b]);
            let bottomCol = gridCols - 1 - b;
            let carry = 0;
            let partialStr = "";
            let partialRow = partialStartRow + b;

            for (let z = 0; z < b; z++) {
                let zeroCol = gridCols - 1 - z;
                steps.push({
                    type: 'zero',
                    write: { r: partialRow, c: zeroCol, val: '0' },
                    msg: `Shift left by adding a 0 for the next place value.`,
                    clearCarries: (z === 0)
                });
                planCell(partialRow, zeroCol, '0');
                partialStr = "0" + partialStr;
            }

            for (let t = 0; t < len1; t++) {
                let topDigit = parseInt(num1[len1 - 1 - t]);
                let topCol = gridCols - 1 - t;
                
                let prod = (bottomDigit * topDigit) + carry;
                let write = prod % 10;
                let nextCarry = Math.floor(prod / 10);
                partialStr = write.toString() + partialStr;

                let msg = `${topDigit} × ${bottomDigit} = ${topDigit * bottomDigit}.`;
                if (carry > 0) msg += ` Add carry ${carry} = ${prod}.`;
                if (nextCarry > 0) msg += ` Write ${write}, carry ${nextCarry}.`;
                else msg += ` Write ${write}.`;

                let writeCol = gridCols - 1 - b - t;
                steps.push({
                    type: 'calc',
                    src: [[1, topCol], [2, bottomCol]],
                    write: { r: partialRow, c: writeCol, val: write },
                    carryOut: nextCarry > 0 ? { r: 0, c: writeCol - 1, val: nextCarry } : null,
                    clearCarries: (t === 0 && b > 0),
                    msg: msg
                });
                planCell(partialRow, writeCol, write);

                carry = nextCarry;
            }

            if (carry > 0) {
                partialStr = carry.toString() + partialStr;
                let writeCol = gridCols - 1 - b - len1;
                steps.push({
                    type: 'calc',
                    src: [],
                    write: { r: partialRow, c: writeCol, val: carry },
                    carryOut: null,
                    msg: `Drop down the final carry: ${carry}.`
                });
                planCell(partialRow, writeCol, carry);
            }
            partialResults.push(parseInt(partialStr));
        }

        // Final Addition Phase
        if (needsAddition) {
            steps.push({
                type: 'line',
                row: secondLineRow,
                opCol: gridCols - partialResults[partialResults.length-1].toString().length - 1,
                msg: "Now, add the partial products together.",
                clearCarries: true // wipe any leftover multiplication carry marks from row 0
            });

            let addCarry = 0;

            for (let c = gridCols - 1; c >= 0; c--) {
                let colHasNum = false;
                let colSum = addCarry;
                let srcCells = [];

                for (let b = 0; b < len2; b++) {
                    let r = partialStartRow + b;
                    let cellVal = getPlanned(r, c);
                    if (cellVal !== '') {
                        colHasNum = true;
                        colSum += parseInt(cellVal);
                        srcCells.push([r, c]);
                    }
                }

                if (!colHasNum && addCarry === 0) break;

                let write = colSum % 10;
                let nextCarry = Math.floor(colSum / 10);

                steps.push({
                    type: 'calc',
                    src: srcCells,
                    write: { r: finalResultRow, c: c, val: write },
                    carryOut: nextCarry > 0 ? { r: addCarryRow, c: c, val: nextCarry, isAddCarry: true } : null,
                    msg: `Add column: Write ${write}${nextCarry > 0 ? ', carry '+nextCarry : ''}.`
                });
                addCarry = nextCarry;
            }
        }

        steps.push({ type: 'done', msg: "Multiplication Complete!" });
    }

    // --- DOM BUILDER ---
    function buildDOMGrid() {
        const gridEl = document.getElementById('paper-grid');
        gridEl.style.gridTemplateColumns = `repeat(${gridCols}, 1em)`;
        gridEl.innerHTML = '';
        virtualGrid = [];

        for(let r=0; r<gridRows; r++) {
            virtualGrid[r] = [];
            for(let c=0; c<gridCols; c++) {
                virtualGrid[r][c] = '';
                let cell = document.createElement('div');
                cell.className = 'cell hidden';
                cell.id = `cell-${r}-${c}`;
                
                if (r === 0) cell.classList.add('carry'); 
                
                gridEl.appendChild(cell);
            }
        }
    }

    function setCell(r, c, val, classes) {
        virtualGrid[r][c] = val;
        let el = document.getElementById(`cell-${r}-${c}`);
        if(el) {
            el.innerText = val;
            el.className = `cell ${classes}`;
        }
    }

    // --- EXECUTION ENGINE ---
    
    function resetGridVisuals() {
        document.querySelectorAll('.cell').forEach(el => {
            el.classList.remove('highlight-src', 'highlight-dest', 'highlight-carry');
            let [_, r, c] = el.id.split('-');
            r = parseInt(r);
            if (r === 0 || r >= 4 || el.classList.contains('carry')) {
                el.classList.add('hidden');
                el.innerText = '';
            }
        });
        document.getElementById('explainer').innerText = "Click the numbers to solve!";
        document.getElementById('explainer').classList.add('show');
    }

    function executeStep() {
        if (currentStepIdx >= steps.length) {
            clearInterval(playInterval);
            isPlaying = false;
            document.getElementById('paper-grid').classList.remove('playing');
            return;
        }

        const step = steps[currentStepIdx];
        const explainer = document.getElementById('explainer');

        document.querySelectorAll('.cell').forEach(el => {
            el.classList.remove('highlight-src', 'highlight-dest', 'highlight-carry');
            if (step.clearCarries && el.classList.contains('carry')) {
                el.innerText = '';
                el.classList.add('hidden');
                el.classList.remove('visible'); // 'visible' otherwise still wins over 'hidden' (later rule, same specificity)
            }
        });

        if (step.type === 'line') {
            playSound('tick');
            setCell(step.row - 1, step.opCol, '+', 'visible operator');
            for(let c = step.opCol; c < gridCols; c++) {
                setCell(step.row, c, '', 'visible line-cell');
            }
        } 
        else if (step.type === 'zero') {
            playSound('write');
            setCell(step.write.r, step.write.c, step.write.val, 'visible highlight-dest');
        }
        else if (step.type === 'calc') {
            playSound('tick');
            
            if (step.src) {
                step.src.forEach(coord => {
                    document.getElementById(`cell-${coord[0]}-${coord[1]}`).classList.add('highlight-src');
                });
            }
            
            setTimeout(() => {
                playSound('write');
                setCell(step.write.r, step.write.c, step.write.val, 'visible highlight-dest');
                
                if (step.carryOut) {
                    playSound('carry');
                    let cl = 'visible carry highlight-carry';
                    setCell(step.carryOut.r, step.carryOut.c, step.carryOut.val, cl);
                }
            }, 300);
        }
        else if (step.type === 'done') {
            playSound('done');
            document.querySelectorAll('.cell.visible').forEach(el => {
                let [_, r, c] = el.id.split('-');
                if (parseInt(r) === gridRows - 1) {
                    el.classList.add('highlight-dest');
                    el.style.color = 'var(--text-yellow)'; // Make final answer pop in yellow
                }
            });
        }

        explainer.innerText = step.msg;
        explainer.classList.add('show');

        currentStepIdx++;
    }

    // Boot up
    setupProblem();

</script>
</body>
</html>
