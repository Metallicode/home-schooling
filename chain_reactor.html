<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chain Reactor</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: #050508; color: #fff;
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box; text-align: center;
        }
        
        h1 { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); margin: 0 0 5px 0; letter-spacing: 2px;}
        p { font-size: 16px; color: #b2ebf2; margin: 0 0 20px 0;}

        /* --- DASHBOARD --- */
        .dashboard {
            display: flex; flex-direction: column; width: 100%; max-width: 900px; 
            gap: 20px; justify-content: center; align-items: center;
        }

        /* --- LIVE RESULT SCREEN --- */
        .result-screen {
            background: #111; padding: 20px 40px; border-radius: 15px; 
            border: 2px solid #333; box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            width: 100%; box-sizing: border-box; display: flex; flex-direction: column;
            align-items: center; gap: 10px;
        }
        .result-label { color: #888; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold;}
        .result-value { font-size: 48px; font-weight: bold; color: #ffeb3b; text-shadow: 0 0 20px rgba(255, 235, 59, 0.5);}

        /* --- THE CHAIN DISPLAY --- */
        .chain-display {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
            background: #0a0a0d; border-radius: 15px; padding: 30px; border: 1px solid #222;
            width: 100%; box-sizing: border-box; min-height: 150px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Term Blocks */
        .term-block {
            padding: 15px 20px; border-radius: 10px; font-size: 24px; font-weight: bold;
            background: #222; color: #fff; border: 2px solid #444;
            transition: all 0.3s ease; display: inline-flex; justify-content: center; align-items: center;
        }
        
        /* Operator Colors */
        .op-add-sub { background: rgba(0, 229, 255, 0.1); border-color: #00e5ff; color: #00e5ff; box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);}
        .op-mul-div { background: rgba(255, 64, 129, 0.1); border-color: #ff4081; color: #ff4081; box-shadow: 0 0 10px rgba(255, 64, 129, 0.2);}
        
        /* Animation States */
        .anim-highlight { transform: scale(1.15); z-index: 10; box-shadow: 0 0 30px #ffeb3b; border-color: #ffeb3b; color: #ffeb3b; background: rgba(255, 235, 59, 0.2);}
        .anim-fade { opacity: 0; transform: scale(0.5); margin: 0 -20px; }

        /* --- KEYPAD --- */
        .keypad-container {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            background: #111; padding: 25px; border-radius: 15px; border: 1px solid #222;
            width: 100%; max-width: 500px;
        }

        .key-btn {
            background: #222; color: #fff; border: 2px solid #444; border-radius: 10px;
            padding: 20px; font-size: 24px; font-family: inherit; font-weight: bold;
            cursor: pointer; transition: all 0.1s;
        }
        .key-btn:hover { background: #333; transform: translateY(-2px); }
        .key-btn:active { transform: translateY(2px); }

        .key-op-low { color: #00e5ff; border-color: #00e5ff; }
        .key-op-high { color: #ff4081; border-color: #ff4081; }
        
        .key-action { background: #1a1a1a; color: #ffeb3b; border-color: #ffeb3b; grid-column: span 2;}
        .key-animate { background: #ffeb3b; color: #000; grid-column: span 4; font-size: 20px; border-color: #ffeb3b;}
        .key-animate:hover { box-shadow: 0 0 20px rgba(255, 235, 59, 0.6); }
        
        .key-disabled { opacity: 0.5; pointer-events: none; }

        .toggle-container {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: #b388ff; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        .toggle-container input { width: 18px; height: 18px; accent-color: #b388ff; cursor: pointer; }

        .home-link {
            display: inline-block; margin-top: 25px; color: #888; text-decoration: none;
            font-size: 14px; border: 1px solid #333; padding: 8px 18px; border-radius: 50px;
            transition: all 0.2s ease;
        }
        .home-link:hover { color: #00e5ff; border-color: #00e5ff; }

    </style>
</head>
<body>

    <h1>⛓️ The Chain Reactor ⛓️</h1>
    <p>Build a mathematical chain. Watch the order of operations collapse it.</p>

    <div class="dashboard">
        
        <!-- LIVE RESULT -->
        <div class="result-screen">
            <div class="result-label">Current Energy Level</div>
            <div class="result-value" id="live-result">0</div>
        </div>

        <!-- CHAIN DISPLAY -->
        <div class="chain-display" id="chain-display">
            <!-- Blocks will be injected here by JS -->
        </div>

        <!-- KEYPAD -->
        <div class="keypad-container" id="keypad">
            <button class="key-btn" onclick="inputNum('7')">7</button>
            <button class="key-btn" onclick="inputNum('8')">8</button>
            <button class="key-btn" onclick="inputNum('9')">9</button>
            <button class="key-btn key-op-high" onclick="inputOp('÷')">÷</button>
            
            <button class="key-btn" onclick="inputNum('4')">4</button>
            <button class="key-btn" onclick="inputNum('5')">5</button>
            <button class="key-btn" onclick="inputNum('6')">6</button>
            <button class="key-btn key-op-high" onclick="inputOp('×')">×</button>
            
            <button class="key-btn" onclick="inputNum('1')">1</button>
            <button class="key-btn" onclick="inputNum('2')">2</button>
            <button class="key-btn" onclick="inputNum('3')">3</button>
            <button class="key-btn key-op-low" onclick="inputOp('-')">-</button>
            
            <button class="key-btn" onclick="inputNum('0')">0</button>
            <button class="key-btn" onclick="backspace()">⌫</button>
            <button class="key-btn key-action" onclick="clearAll()" style="grid-column: span 1; color: #ff5252; border-color: #ff5252;">AC</button>
            <button class="key-btn key-op-low" onclick="inputOp('+')">+</button>

            <button class="key-btn key-animate" id="btn-animate" onclick="startAnimation()">✨ Animate Solution ✨</button>
        </div>

        <label class="toggle-container">
            <input type="checkbox" id="toggle-sound" checked onchange="initAudio()">
            🎵 Enable Synesthesia (Sound)
        </label>

    </div>

    <a class="home-link" href="index.html">⬅ Back to Home</a>

<script>
    // --- STATE ---
    // The chain is an array of strings. Even indexes are numbers, odd indexes are operators.
    // E.g., ["2", "+", "4", "×", "5"]
    let chain = ["0"]; 
    let isAnimating = false;

    // --- AUDIO ENGINE ---
    let audioCtx;
    let masterGain;

    function initAudio() {
        if (document.getElementById('toggle-sound').checked && !audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.3;
            masterGain.connect(audioCtx.destination);
        }
    }

    function playBlip(type) {
        if (!audioCtx || !document.getElementById('toggle-sound').checked) return;
        
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(masterGain);
        
        // Pitch mapping based on operation
        if (type === 'mul-div') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High pitch (A5)
        } else if (type === 'add-sub') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime); // Low pitch (A3)
        } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime); 
        } else if (type === 'done') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.3); // Sweep up
        }

        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (type === 'done' ? 0.8 : 0.3));

        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 1);
    }

    // --- INPUT HANDLING ---
    const display = document.getElementById('chain-display');
    const liveResult = document.getElementById('live-result');
    const keypad = document.getElementById('keypad');

    function isOperator(val) {
        return ['+', '-', '×', '÷'].includes(val);
    }

    function inputNum(numStr) {
        if (isAnimating) return;
        playBlip('click');

        let lastIdx = chain.length - 1;
        let lastVal = chain[lastIdx];

        if (isOperator(lastVal)) {
            // Start a new number block
            chain.push(numStr);
        } else {
            // Append to current number block
            if (lastVal === "0") {
                chain[lastIdx] = numStr; // Replace leading zero
            } else {
                // Prevent ridiculously long numbers that break the layout
                if (lastVal.length < 8) chain[lastIdx] += numStr; 
            }
        }
        renderChain();
    }

    function inputOp(opStr) {
        if (isAnimating) return;
        playBlip('click');

        let lastIdx = chain.length - 1;
        let lastVal = chain[lastIdx];

        if (isOperator(lastVal)) {
            // Swap operator if they changed their mind
            chain[lastIdx] = opStr;
        } else {
            // Add operator block
            chain.push(opStr);
        }
        renderChain();
    }

    function backspace() {
        if (isAnimating) return;
        playBlip('click');

        let lastIdx = chain.length - 1;
        let lastVal = chain[lastIdx];

        if (isOperator(lastVal)) {
            chain.pop(); // Remove operator
        } else {
            if (lastVal.length > 1) {
                chain[lastIdx] = lastVal.slice(0, -1); // Remove last digit
            } else {
                if (chain.length > 1) {
                    chain.pop(); // Remove the single digit
                } else {
                    chain[0] = "0"; // Reset to 0 if it's the last thing
                }
            }
        }
        renderChain();
    }

    function clearAll() {
        if (isAnimating) return;
        playBlip('click');
        chain = ["0"];
        renderChain();
    }

    // --- RENDERING & EVALUATION ---
    function renderChain(customChain = null) {
        display.innerHTML = '';
        const dataToRender = customChain || chain;

        dataToRender.forEach((term, index) => {
            const block = document.createElement('div');
            block.className = 'term-block';
            block.innerText = term;
            block.id = `block-${index}`;

            if (isOperator(term)) {
                if (term === '×' || term === '÷') block.classList.add('op-mul-div');
                else block.classList.add('op-add-sub');
            }
            display.appendChild(block);
        });

        // Only update live result if we are NOT in the middle of a custom animation
        if (!customChain) {
            updateLiveResult();
        }
    }

    function calculateCleanArray(arr) {
        let temp = [...arr];
        // Strip trailing operator for calculation
        if (isOperator(temp[temp.length - 1])) temp.pop();

        // Pass 1: Multiplication and Division
        for (let i = 1; i < temp.length - 1; i += 2) {
            if (temp[i] === '×' || temp[i] === '÷') {
                let left = parseFloat(temp[i - 1]);
                let right = parseFloat(temp[i + 1]);
                let res = temp[i] === '×' ? (left * right) : (left / right);
                
                // Avoid tiny float errors
                res = Math.round(res * 1000000) / 1000000;
                
                temp.splice(i - 1, 3, res.toString());
                i -= 2; // Step back to check the new arrangement
            }
        }

        // Pass 2: Addition and Subtraction
        for (let i = 1; i < temp.length - 1; i += 2) {
            if (temp[i] === '+' || temp[i] === '-') {
                let left = parseFloat(temp[i - 1]);
                let right = parseFloat(temp[i + 1]);
                let res = temp[i] === '+' ? (left + right) : (left - right);
                
                res = Math.round(res * 1000000) / 1000000;
                
                temp.splice(i - 1, 3, res.toString());
                i -= 2;
            }
        }

        return temp.length > 0 ? temp[0] : "0";
    }

    function updateLiveResult() {
        let res = calculateCleanArray(chain);
        if (res === "Infinity" || isNaN(res)) res = "∞"; // Catch division by zero safely
        liveResult.innerText = res;
    }

    // --- STEP-BY-STEP ANIMATION ENGINE ---
    // Wait function for async animations
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function startAnimation() {
        // Prevent overlapping animations and clean up trailing operators
        if (isAnimating) return;
        if (isOperator(chain[chain.length - 1])) chain.pop();
        if (chain.length < 3) return; // Nothing to animate

        isAnimating = true;
        keypad.classList.add('key-disabled'); // Lock UI

        // Ensure Audio Context is awake
        if (document.getElementById('toggle-sound').checked && !audioCtx) initAudio();

        let currentChain = [...chain];

        // The Engine Loop
        while (currentChain.length > 1) {
            // Find the highest precedence operation based on PEMDAS
            let opIndex = currentChain.findIndex(t => t === '×' || t === '÷');
            let isHighPriority = true;
            
            if (opIndex === -1) {
                opIndex = currentChain.findIndex(t => t === '+' || t === '-');
                isHighPriority = false;
            }

            if (opIndex === -1) break; // Safety net

            // 1. Highlight the three blocks involved (Left, Op, Right)
            renderChain(currentChain);
            const bLeft = document.getElementById(`block-${opIndex - 1}`);
            const bOp = document.getElementById(`block-${opIndex}`);
            const bRight = document.getElementById(`block-${opIndex + 1}`);

            await sleep(400); // Pause so she can see what's selected

            bLeft.classList.add('anim-highlight');
            bOp.classList.add('anim-highlight');
            bRight.classList.add('anim-highlight');

            // Play the appropriate synesthesia sound!
            playBlip(isHighPriority ? 'mul-div' : 'add-sub');

            await sleep(800); // Hold the highlight

            // 2. Perform the math
            let leftVal = parseFloat(currentChain[opIndex - 1]);
            let rightVal = parseFloat(currentChain[opIndex + 1]);
            let op = currentChain[opIndex];
            let res = 0;

            if (op === '×') res = leftVal * rightVal;
            if (op === '÷') res = leftVal / rightVal;
            if (op === '+') res = leftVal + rightVal;
            if (op === '-') res = leftVal - rightVal;

            res = Math.round(res * 1000000) / 1000000;

            // 3. Animation: Collapse the outer blocks inward
            bLeft.classList.add('anim-fade');
            bRight.classList.add('anim-fade');
            
            // Transform the center operator block into the new result block!
            bOp.innerText = res;
            bOp.classList.remove('op-mul-div', 'op-add-sub');
            bOp.style.backgroundColor = "#ffeb3b";
            bOp.style.color = "#000";

            await sleep(600); // Wait for the physical CSS collapse to finish

            // 4. Update the logical array and redraw clean
            currentChain.splice(opIndex - 1, 3, res.toString());
            renderChain(currentChain);
            
            await sleep(400); // Breathe before next step
        }

        // 5. Final Celebration
        playBlip('done');
        const finalBlock = document.getElementById('block-0');
        if (finalBlock) {
            finalBlock.classList.add('anim-highlight');
            finalBlock.style.backgroundColor = "#ffeb3b";
            finalBlock.style.color = "#000";
            await sleep(1000);
            finalBlock.classList.remove('anim-highlight');
        }

        // Restore State
        chain = currentChain;
        isAnimating = false;
        keypad.classList.remove('key-disabled');
        renderChain(); 
    }

    // Initial render
    renderChain();

</script>
</body>
</html>
