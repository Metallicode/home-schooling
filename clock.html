<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Time Traveler</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: #f0f4c3; padding: 20px; color: #33691e;
            margin: 0; min-height: 100vh; box-sizing: border-box; text-align: center;
        }
        
        h1 { color: #558b2f; font-size: 2.5rem; text-shadow: 2px 2px 0px #fff; margin: 0 0 5px 0; }
        p { font-size: 18px; color: #689f38; font-weight: bold; margin: 0 0 20px 0;}

        /* --- LAYOUT --- */
        .app-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; max-width: 1400px;
        }

        .card {
            background: white; padding: 20px; border-radius: 25px; 
            border: 5px solid #c5e1a5; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center;
        }
        
        .card h2 { margin: 0 0 15px 0; color: #558b2f; font-size: 20px; }

        /* --- DAY/NIGHT ANIMATION (THE SKY BOX) --- */
        #sky-box {
            width: 250px; height: 250px; border-radius: 50%;
            background: #4FC3F7; border: 8px solid #e0e0e0;
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }

        #celestial-pivot {
            position: absolute; top: 50%; left: 50%;
            width: 100%; height: 100%;
            transform: translate(-50%, -50%) rotate(0deg);
            transition: transform 0.1s linear;
        }

        .celestial-body {
            position: absolute; font-size: 60px;
            left: 50%; transform: translateX(-50%);
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
            text-align: center;
        }
        #sun { top: 10px; }
        #stars { 
            bottom: 20px; font-size: 30px; letter-spacing: 5px;
            transform: translateX(-50%) rotate(180deg); 
            color: #fff; text-shadow: 0 0 10px #fff; width: 150px;
        }

        #ground {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 35%;
            background: #81c784; border-top: 5px solid #66bb6a;
            border-radius: 0 0 125px 125px;
        }

        /* --- ANALOG CLOCKS (Base Styles) --- */
        .clock-face {
            width: 250px; height: 250px; border-radius: 50%;
            background: #ffffff; border: 8px solid #37474f;
            position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .clock-center {
            position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
            background: #37474f; border-radius: 50%; transform: translate(-50%, -50%); z-index: 10;
        }

        .hand {
            position: absolute; bottom: 50%; left: 50%;
            transform-origin: bottom center; border-radius: 10px;
            transition: transform 0.1s linear;
        }
        .number {
            position: absolute; font-weight: bold;
            transform: translate(-50%, -50%);
        }

        /* --- 12 HOUR CLOCK SPECIFICS --- */
        #hour-hand-12 { width: 8px; height: 60px; background: #1976d2; margin-left: -4px; z-index: 3; }
        #minute-hand-12 { width: 5px; height: 95px; background: #ff9800; margin-left: -2.5px; z-index: 2; }
        .num-12h { font-size: 22px; color: #1976d2; }

        /* --- 24 HOUR CLOCK SPECIFICS --- */
        #hour-hand-24 { width: 8px; height: 85px; background: #d32f2f; margin-left: -4px; z-index: 3; }
        .num-24h { font-size: 14px; color: #d32f2f; }

        /* --- DIGITAL CLOCK (AM/PM) --- */
        .digital-clock-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 250px;
        }
        .led-clock {
            background: #111; padding: 25px 35px; border-radius: 15px;
            font-family: 'Courier New', Courier, monospace; font-size: 45px; font-weight: bold;
            border: 5px solid #333; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            text-align: center; color: #00e676; text-shadow: 0 0 15px #00e676;
            min-width: 200px;
        }

        /* --- CONTROLS --- */
        .control-panel {
            background: white; padding: 30px; border-radius: 25px; 
            border: 5px solid #aed581; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%; max-width: 800px; margin-top: 30px;
        }

        .slider-container { width: 100%; }
        
        input[type="range"] {
            width: 100%; height: 25px; border-radius: 12px;
            background: #e0e0e0; outline: none; -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 45px; height: 45px; border-radius: 50%;
            background: #558b2f; cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.3); border: 4px solid #fff;
        }

        .button-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        
        .time-btn {
            background: #7cb342; color: white; border: none; border-radius: 15px;
            padding: 12px 25px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 0 #558b2f; transition: all 0.1s;
        }
        .time-btn:active { transform: translateY(5px); box-shadow: 0 0px 0 #558b2f; }

    </style>
</head>
<body>


<a href="index.html" id="home-link" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(255,255,255,0.9);border:2px solid #ddd;border-radius:50px;padding:6px 16px;font-family:'Comic Sans MS','Chalkboard SE',cursive;font-size:0.9rem;font-weight:bold;color:#555;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.13);white-space:nowrap;" title="Back to Home">&#x1F3E0; Home</a>

    <h1>☀️ The Time Traveler 🌙</h1>
    <p>Move the big slider to travel through the day!</p>

    <div class="app-container">
        
        <!-- 1. DAY/NIGHT ANIMATION -->
        <div class="card">
            <h2>The Sky</h2>
            <div id="sky-box">
                <div id="celestial-pivot">
                    <div class="celestial-body" id="sun">☀️</div>
                    <div class="celestial-body" id="stars">✨ ⭐ ✨</div>
                </div>
                <div id="ground"></div>
            </div>
        </div>

        <!-- 2. REGULAR 12-HOUR CLOCK -->
        <div class="card">
            <h2 style="color: #1976d2;">12h Clock</h2>
            <div class="clock-face" id="clock-12">
                <div class="clock-center"></div>
                <div class="hand" id="hour-hand-12"></div>
                <div class="hand" id="minute-hand-12"></div>
                <!-- Numbers generated by JS -->
            </div>
        </div>

        <!-- 3. 24-HOUR ANALOG CLOCK -->
        <div class="card">
            <h2 style="color: #d32f2f;">24h Clock</h2>
            <div class="clock-face" id="clock-24">
                <div class="clock-center"></div>
                <div class="hand" id="hour-hand-24"></div>
                <!-- Numbers generated by JS -->
            </div>
        </div>

        <!-- 4. DIGITAL CLOCK -->
        <div class="card">
            <h2>Digital Clock</h2>
            <div class="digital-clock-container">
                <div class="led-clock" id="digital-12h">
                    12:00 AM
                </div>
            </div>
        </div>

    </div>

    <!-- CONTROLS -->
    <div class="control-panel">
        <h2 style="margin: 0 0 15px 0; color: #558b2f;">Time Machine Controls</h2>
        <div class="slider-container">
            <input type="range" id="time-slider" min="0" max="1439" value="540" oninput="handleSliderChange()">
        </div>
        <div class="button-row">
            <button class="time-btn" onclick="stepTime(-60)">- 1 Hour</button>
            <button class="time-btn" onclick="stepTime(-15)">- 15 Min</button>
            <button class="time-btn" onclick="stepTime(15)">+ 15 Min</button>
            <button class="time-btn" onclick="stepTime(60)">+ 1 Hour</button>
        </div>
    </div>

<script>
    // --- DOM Elements ---
    const skyBoxEl = document.getElementById('sky-box');
    const celestialPivotEl = document.getElementById('celestial-pivot');
    
    const hourHand12El = document.getElementById('hour-hand-12');
    const minuteHand12El = document.getElementById('minute-hand-12');
    const hourHand24El = document.getElementById('hour-hand-24');
    
    const digital12hEl = document.getElementById('digital-12h');
    const timeSliderEl = document.getElementById('time-slider');
    
    const clock12El = document.getElementById('clock-12');
    const clock24El = document.getElementById('clock-24');

    let currentMinutes = 540; // Starts at 9:00 AM 

    // --- INITIALIZE CLOCK FACES ---
    function buildClockFaces() {
        const radius = 100; // Distance from center

        // Build 12-Hour Clock (1 to 12)
        for (let i = 1; i <= 12; i++) {
            const angle = (i * 30) * (Math.PI / 180);
            const num = document.createElement('div');
            num.className = 'number num-12h';
            num.innerText = i;
            num.style.left = 125 + Math.sin(angle) * radius + 'px';
            num.style.top = 125 - Math.cos(angle) * radius + 'px';
            clock12El.appendChild(num);
        }

        // Build 24-Hour Clock (1 to 24)
        for (let i = 1; i <= 24; i++) {
            const angle = (i * 15) * (Math.PI / 180); // 360 / 24 = 15 degrees per hour
            const num = document.createElement('div');
            num.className = 'number num-24h';
            num.innerText = i;
            num.style.left = 125 + Math.sin(angle) * 105 + 'px'; // slightly wider radius so they don't crowd
            num.style.top = 125 - Math.cos(angle) * 105 + 'px';
            clock24El.appendChild(num);
        }
    }

    // --- CORE LOGIC ---
    function handleSliderChange() {
        currentMinutes = parseInt(timeSliderEl.value);
        updateAllClocks();
    }

    function stepTime(amount) {
        currentMinutes += amount;
        if (currentMinutes < 0) currentMinutes += 1440;
        if (currentMinutes >= 1440) currentMinutes -= 1440;
        timeSliderEl.value = currentMinutes;
        updateAllClocks();
    }

    function updateAllClocks() {
        const hours24 = Math.floor(currentMinutes / 60);
        const mins = currentMinutes % 60;

        // 1. Digital Clock (AM/PM)
        const ampm = hours24 >= 12 ? 'PM' : 'AM';
        let hours12 = hours24 % 12;
        if (hours12 === 0) hours12 = 12; 

        const strMins = mins.toString().padStart(2, '0');
        digital12hEl.innerText = `${hours12}:${strMins} ${ampm}`;

        // 2. Regular 12-Hour Analog Clock
        const minuteAngle = mins * 6; // 360 / 60
        const hourAngle12 = (hours12 * 30) + (mins * 0.5); // 30 degrees per hour

        minuteHand12El.style.transform = `rotate(${minuteAngle}deg)`;
        hourHand12El.style.transform = `rotate(${hourAngle12}deg)`;

        // 3. 24-Hour Analog Clock (Single Hand)
        // Hand completes one full 360-degree rotation every 1440 minutes (24h)
        const hourAngle24 = (currentMinutes / 1440) * 360;
        hourHand24El.style.transform = `rotate(${hourAngle24}deg)`;

        // 4. Sky Animation (Sun and Stars)
        // 0 mins = Midnight = 180deg (Stars up). 720 mins = Noon = 360deg (Sun up)
        const skyRotation = ((currentMinutes / 1440) * 360) + 180;
        celestialPivotEl.style.transform = `translate(-50%, -50%) rotate(${skyRotation}deg)`;

        // Sky Color based on time
        if (hours24 >= 20 || hours24 < 5) {
            skyBoxEl.style.background = "#0B1021"; // Deep Night
        } else if (hours24 >= 5 && hours24 < 7) {
            skyBoxEl.style.background = "#FF8A65"; // Sunrise
        } else if (hours24 >= 7 && hours24 < 18) {
            skyBoxEl.style.background = "#4FC3F7"; // Day Blue
        } else if (hours24 >= 18 && hours24 < 20) {
            skyBoxEl.style.background = "#FFB74D"; // Sunset
        }
    }

    // Initialize
    buildClockFaces();
    updateAllClocks();

</script>
</body>
</html>
