<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Collatz Spire v2</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: #050508; color: #ffeb3b;
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box; text-align: center;
        }
        
        h1 { color: #ffeb3b; font-size: 2.5rem; text-shadow: 0 0 15px rgba(255, 235, 59, 0.5); margin: 0 0 5px 0; letter-spacing: 2px;}
        p { font-size: 16px; color: #fff59d; margin: 0 0 20px 0;}

        /* --- DASHBOARD LAYOUT --- */
        .dashboard {
            display: flex; flex-direction: row; width: 100%; max-width: 1400px; 
            gap: 20px; justify-content: center; align-items: stretch; height: 65vh; min-height: 500px;
        }

        /* --- LEFT PANEL: READOUT --- */
        .readout-panel {
            flex: 1; background: #111; padding: 25px; border-radius: 15px; 
            border: 1px solid #222; box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: flex-start; gap: 15px;
            min-width: 280px; max-width: 350px; text-align: left;
        }

        .stat-box { background: #0a0a0a; border: 1px solid #222; padding: 15px; border-radius: 10px; position: relative;}
        .stat-label { color: #666; font-size: 13px; text-transform: uppercase; margin-bottom: 5px; font-weight: bold;}
        .stat-value { font-size: 32px; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); word-break: break-all;}
        
        .c-even { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.6); }
        .c-odd { color: #ff4081; text-shadow: 0 0 15px rgba(255, 64, 129, 0.6); }
        .c-peak { color: #ffeb3b; }

        /* --- CENTER CANVAS --- */
        .canvas-wrapper {
            flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #000; border-radius: 15px; padding: 15px; border: 2px solid #222;
            box-shadow: 0 0 40px rgba(255, 235, 59, 0.05); min-width: 500px; position: relative;
        }
        
        canvas {
            width: 100%; height: 100%; object-fit: contain;
            border-radius: 8px; border: 1px solid #111; background: #030305;
        }

        /* --- CONTROL PANEL --- */
        .control-panel {
            background: #111; padding: 25px; border-radius: 15px; 
            border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px;
            margin-top: 20px;
        }

        .input-row { display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap;}
        
        input[type="number"] {
            background: #000; border: 2px solid #ffeb3b; color: #ffeb3b;
            padding: 12px 20px; font-size: 24px; border-radius: 10px; outline: none;
            font-family: inherit; font-weight: bold; width: 180px; text-align: center;
        }
        input[type="number"]:focus { box-shadow: 0 0 15px rgba(255, 235, 59, 0.4); }

        .btn {
            background: #111; color: #ffeb3b; border: 2px solid #ffeb3b; border-radius: 10px;
            padding: 12px 25px; font-size: 16px; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
        }
        .btn:hover { background: #ffeb3b; color: #000; box-shadow: 0 0 20px rgba(255, 235, 59, 0.6); }

        .slider-group { display: flex; flex-direction: column; text-align: left; gap: 10px; margin-top: 5px;}
        .slider-header { display: flex; justify-content: space-between; color: #b2ebf2; font-weight: bold; font-size: 14px;}
        
        input[type="range"] {
            width: 100%; height: 8px; border-radius: 4px; background: #333; outline: none; -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 25px; height: 25px; border-radius: 50%;
            background: #00e5ff; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 10px #00e5ff;
        }

        .toggle-container {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: #b388ff; font-weight: bold; cursor: pointer; padding: 10px 15px;
            background: #1a1a1a; border-radius: 8px; border: 1px solid #333;
        }
        .toggle-container input { width: 18px; height: 18px; accent-color: #b388ff; cursor: pointer; }

        select {
            background: #1a1a1a; color: #00e5ff; border: 1px solid #333; padding: 10px 15px;
            font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 14px;
            border-radius: 8px; cursor: pointer; outline: none;
        }

        @media (max-width: 1000px) {
            .dashboard { flex-direction: column; height: auto; }
            .readout-panel { max-width: 100%; }
            .canvas-wrapper { height: 500px; min-width: 100%; }
        }

    </style>
</head>
<body>

    <a href="index.html" style="position: fixed; top: 15px; left: 15px; z-index: 1000; font-family: 'Courier New', Courier, monospace; font-size: 13px; font-weight: bold; color: #fff; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); padding: 8px 14px; border-radius: 8px; text-decoration: none; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.08)'">← Back to Index</a>

    <h1>⚡ The Data Spire ⚡</h1>
    <p>Watch the chaotic mathematics unfold node-by-node in flawless motion.</p>

    <div class="dashboard">
        
        <!-- LIVE READOUT -->
        <div class="readout-panel">
            <div class="stat-box">
                <div class="stat-label">Calculating Node</div>
                <div class="stat-value" id="val-current">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Operation</div>
                <div class="stat-value" id="val-op" style="font-size: 18px; color: #888;">Waiting...</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Peak Altitude</div>
                <div class="stat-value c-peak" id="val-peak">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Timeline Progress</div>
                <div class="stat-value" style="color: #b388ff;" id="val-steps">0 / 0</div>
            </div>
        </div>

        <!-- CANVAS -->
        <div class="canvas-wrapper">
            <canvas id="spireCanvas" width="900" height="700"></canvas>
        </div>

    </div>

    <!-- CONTROLS -->
    <div class="control-panel">
        
        <div class="input-row">
            <input type="number" id="input-number" value="27" min="1" max="9999999999">
            <button class="btn" onclick="launchSpire()">Launch Sequence</button>
            <button class="btn" onclick="clearCanvas()" style="border-color: #555; color: #888;">Clear</button>
        </div>

        <div class="input-row">
            <select id="mode-selector">
                <option value="linear">Architecture: Grid Timeline</option>
                <option value="radial">Architecture: Radar Spiral</option>
            </select>
            
            <label class="toggle-container">
                <input type="checkbox" id="toggle-layering" checked>
                Keep Old Paths
            </label>
            <label class="toggle-container" style="border-color: #ffeb3b; color: #ffeb3b;">
                <input type="checkbox" id="toggle-sound" onchange="initAudio()">
                🎵 Gliding Synth
            </label>
        </div>

        <!-- UPDATED SLIDER: 0.01 to 2.0 for smooth motion -->
        <div class="slider-group">
            <div class="slider-header">
                <span>Laser Speed (Interpolation)</span>
                <span id="val-speed">0.20</span>
            </div>
            <input type="range" id="slider-speed" min="0.01" max="2" step="0.01" value="0.2" oninput="document.getElementById('val-speed').innerText = parseFloat(this.value).toFixed(2)">
        </div>

    </div>

<script>
    // --- UI ELEMENTS ---
    const valCurrent = document.getElementById('val-current');
    const valOp = document.getElementById('val-op');
    const valPeak = document.getElementById('val-peak');
    const valSteps = document.getElementById('val-steps');
    const inputNumber = document.getElementById('input-number');
    const speedSlider = document.getElementById('slider-speed');
    const layeringToggle = document.getElementById('toggle-layering');
    const modeSelector = document.getElementById('mode-selector');
    
    // --- CANVAS SETUP ---
    const canvas = document.getElementById('spireCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    
    function drawBackground() {
        if (!layeringToggle.checked) {
            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, width, height);
        } else {
            // Fade old layers to black slowly
            ctx.fillStyle = 'rgba(3, 3, 5, 0.1)';
            ctx.fillRect(0, 0, width, height);
        }
    }
    drawBackground();

    // --- AUDIO ENGINE ---
    let audioCtx;
    let synthOsc;
    let synthGain;
    let isSynthRunning = false;

    function initAudio() {
        if (document.getElementById('toggle-sound').checked && !audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            synthOsc = audioCtx.createOscillator();
            synthGain = audioCtx.createGain();
            
            // Triangle wave sounds more technological/glassy
            synthOsc.type = 'triangle';
            synthGain.gain.value = 0; 
            
            synthOsc.connect(synthGain);
            synthGain.connect(audioCtx.destination);
            synthOsc.start();
            isSynthRunning = true;
        }
    }

    function updateSynth(value, peak) {
        if (!isSynthRunning || !document.getElementById('toggle-sound').checked) return;
        
        const minFreq = 80;
        const maxFreq = 1500;
        // Logarithmic frequency mapping based on Logarithmic math!
        const pitchRatio = Math.log(value) / Math.log(peak || 2);
        const freq = minFreq + (maxFreq - minFreq) * pitchRatio;

        // Ultra-smooth frequency glide (0.05s interpolation)
        synthOsc.frequency.setTargetAtTime(Math.max(freq, 20), audioCtx.currentTime, 0.05);
        synthGain.gain.setTargetAtTime(0.15, audioCtx.currentTime, 0.05);
    }

    function stopSynth() {
        if (isSynthRunning) {
            synthGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); 
        }
    }

    // --- MATHEMATICS & PATH GENERATION ---
    let animationId = null;
    let currentPath = [];
    let progress = 0; // Float value tracking exactly where we are on the line!
    let targetPeak = 1;

    function clearCanvas() {
        ctx.fillStyle = '#030305';
        ctx.fillRect(0, 0, width, height);
        if (animationId) cancelAnimationFrame(animationId);
        currentPath = [];
        stopSynth();
    }

    // Math Engine
    function generateCollatzSequence(startNum) {
        let seq = [startNum];
        let n = startNum;
        let peak = startNum;
        let safety = 0; 
        
        while (n > 1 && safety < 10000) {
            if (n % 2 === 0) { n = n / 2; } 
            else { n = (n * 3) + 1; }
            if (n > peak) peak = n;
            seq.push(n);
            safety++;
        }
        return { sequence: seq, peak: peak };
    }

    // Geometry Engine (Pre-calculates every exact pixel coordinate)
    function generateCoordinates(sequence, peak, mode) {
        let coords = [];
        const padding = 60;
        
        const totalSteps = sequence.length - 1;
        const logPeak = Math.log(peak);

        for (let i = 0; i < sequence.length; i++) {
            const val = sequence[i];
            const logVal = Math.log(val);
            
            let x, y;

            if (mode === 'linear') {
                // X progresses rightward based on steps
                x = padding + (i / totalSteps) * (width - padding * 2);
                // Y progresses upward based on LOG of the value
                y = (height - padding) - (logVal / logPeak) * (height - padding * 2);
                
                // If it hits exactly 1 (log(1) = 0), guarantee it hits the bottom
                if (val === 1) y = height - padding; 
                
            } else if (mode === 'radial') {
                // Angle spins around (e.g., 3 rotations max to look cool)
                const rotations = Math.max(1, totalSteps / 30); 
                const angle = (i / totalSteps) * Math.PI * 2 * rotations - (Math.PI/2);
                
                // Radius pushes outward based on LOG of value
                const maxRadius = Math.min(width, height) / 2 - padding;
                const radius = (logVal / logPeak) * maxRadius;

                x = width / 2 + Math.cos(angle) * radius;
                y = height / 2 + Math.sin(angle) * radius;
                
                // If it hits 1, guarantee it crashes into the dead center
                if (val === 1) { x = width/2; y = height/2; }
            }

            coords.push({
                x: x, y: y, 
                val: val, 
                isEven: (i > 0 && sequence[i-1] % 2 === 0)
            });
        }
        return coords;
    }

    function launchSpire() {
        if (animationId) cancelAnimationFrame(animationId);
        
        const startNum = parseInt(inputNumber.value);
        if (isNaN(startNum) || startNum < 1) return;

        const data = generateCollatzSequence(startNum);
        targetPeak = data.peak;
        currentPath = generateCoordinates(data.sequence, targetPeak, modeSelector.value);
        
        progress = 0; // Reset animation head
        
        valPeak.innerText = targetPeak;
        valSteps.innerText = `0 / ${currentPath.length - 1}`;
        
        drawBackground();
        renderFrame();
    }

    // The Sub-pixel Rendering Engine
    function renderFrame() {
        if (currentPath.length === 0) return;

        const speed = parseFloat(speedSlider.value);
        drawBackground();

        // 1. Draw grid guidelines behind the graph for a "Data" feel
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.lineWidth = 1;
        if (modeSelector.value === 'linear') {
            const padding = 60;
            ctx.beginPath();
            ctx.moveTo(padding, height - padding); ctx.lineTo(width - padding, height - padding); // Base
            ctx.moveTo(padding, padding); ctx.lineTo(width - padding, padding); // Ceiling
            ctx.stroke();
        }

        progress += speed;
        
        let isDone = false;
        if (progress >= currentPath.length - 1) {
            progress = currentPath.length - 1;
            isDone = true;
        }

        const headIndex = Math.floor(progress); // The last fully completed node
        const subPixel = progress - headIndex;  // Decimal % to the next node

        // 2. Draw all completed lines
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        
        for (let i = 1; i <= headIndex; i++) {
            drawSegment(currentPath[i-1], currentPath[i], 1.0);
            drawNode(currentPath[i]);
        }

        // Draw start node explicitly
        drawNode(currentPath[0]);

        // 3. Draw the actively interpolating line
        let currentVal = currentPath[headIndex].val;
        
        if (headIndex < currentPath.length - 1) {
            const pt1 = currentPath[headIndex];
            const pt2 = currentPath[headIndex + 1];
            
            // Math interpolation for smooth coordinates
            const activeX = pt1.x + (pt2.x - pt1.x) * subPixel;
            const activeY = pt1.y + (pt2.y - pt1.y) * subPixel;
            
            // Interpolate the actual math value for the Synthesizer
            currentVal = pt1.val + (pt2.val - pt1.val) * subPixel;

            const activePt = { x: activeX, y: activeY, isEven: pt2.isEven };
            drawSegment(pt1, activePt, 1.0);
            
            // Draw the "Laser Spark"
            ctx.beginPath();
            ctx.arc(activeX, activeY, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#fff";
            ctx.fill();
            ctx.shadowBlur = 0;

            // Update UI with the exact upcoming operation
            valCurrent.innerText = Math.round(currentVal);
            if (pt2.isEven) {
                valOp.innerHTML = `EVEN <br><span style="color:#00e5ff">${pt1.val} ÷ 2 = ${pt2.val}</span>`;
            } else {
                valOp.innerHTML = `ODD <br><span style="color:#ff4081">(${pt1.val} × 3) + 1 = ${pt2.val}</span>`;
            }
        }

        valSteps.innerText = `${headIndex} / ${currentPath.length - 1}`;
        updateSynth(currentVal, targetPeak);

        if (!isDone) {
            animationId = requestAnimationFrame(renderFrame);
        } else {
            valOp.innerHTML = `<span style="color:#ffeb3b">Landed at 1. Loop Reached.</span>`;
            valCurrent.innerText = "1";
            stopSynth();
        }
    }

    // Helper to draw a single line
    function drawSegment(pt1, pt2, alpha) {
        ctx.beginPath();
        ctx.moveTo(pt1.x, pt1.y);
        ctx.lineTo(pt2.x, pt2.y);
        
        if (pt2.isEven) {
            ctx.strokeStyle = `rgba(0, 229, 255, ${alpha})`; // Cyan down
            ctx.shadowColor = "rgba(0, 229, 255, 0.8)";
        } else {
            ctx.strokeStyle = `rgba(255, 64, 129, ${alpha})`; // Pink up
            ctx.shadowColor = "rgba(255, 64, 129, 0.8)";
        }
        
        ctx.lineWidth = 3;
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    // Helper to draw a structural dot
    function drawNode(pt) {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = pt.isEven ? "#00e5ff" : "#ff4081";
        if(pt.val === 1 || pt.val === targetPeak) ctx.fillStyle = "#ffeb3b"; // Highlight peak and end
        ctx.fill();
    }

</script>
</body>
</html>
