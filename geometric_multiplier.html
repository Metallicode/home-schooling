<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Geometric Multiplier v2</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: #050508; color: #fff;
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box; text-align: center;
        }
        
        h1 { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); margin: 0 0 5px 0; letter-spacing: 2px;}
        p { font-size: 16px; color: #b2ebf2; margin: 0 0 20px 0;}

        /* --- DASHBOARD --- */
        .dashboard {
            display: flex; gap: 20px; width: 100%; max-width: 1100px;
            justify-content: center; align-items: stretch; flex-wrap: wrap;
        }

        /* --- CANVAS --- */
        .canvas-container {
            background: #0a0a0d; border: 2px solid #222; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden;
            position: relative; flex: 2; min-width: 450px; display: flex; justify-content: center; align-items: center;
        }
        canvas { width: 100%; max-width: 700px; aspect-ratio: 1/1; background: #030305; }

        /* --- CONTROLS & READOUT --- */
        .panel {
            flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 15px;
            background: #111; padding: 25px; border-radius: 15px; border: 1px solid #333;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .input-row {
            display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 32px; font-weight: bold;
        }

        input[type="number"] {
            width: 80px; font-size: 32px; font-weight: bold; text-align: center;
            background: #222; border: 2px solid #444; color: #fff; border-radius: 10px;
            outline: none; transition: all 0.2s; font-family: inherit;
        }
        
        #num1 { border-color: #00e5ff; color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        #num2 { border-color: #ff4081; color: #ff4081; text-shadow: 0 0 10px rgba(255,64,129,0.5); }

        .btn {
            background: #ffeb3b; color: #000; border: none; border-radius: 10px;
            padding: 15px; font-size: 20px; font-family: inherit; font-weight: bold;
            cursor: pointer; transition: all 0.1s; margin-top: 10px; box-shadow: 0 0 15px rgba(255, 235, 59, 0.4);
        }
        .btn:hover { background: #fff; box-shadow: 0 0 25px #fff; transform: translateY(-2px); }
        .btn:disabled { background: #444; color: #888; box-shadow: none; transform: none; cursor: not-allowed; }

        /* Step-by-Step Readout */
        .readout {
            flex: 1; background: #0a0a0d; border: 1px solid #222; border-radius: 10px;
            padding: 15px; font-size: 15px; text-align: left; overflow-y: auto; color: #ccc;
            display: flex; flex-direction: column; gap: 12px; line-height: 1.4;
        }
        
        .step-highlight { color: #fff; font-weight: bold; background: rgba(255, 235, 59, 0.2); padding: 5px 8px; border-radius: 5px; color: #ffeb3b; border-left: 4px solid #ffeb3b;}
        .step-carry { color: #ff4081; font-weight: bold; background: rgba(255, 64, 129, 0.1); padding: 5px 8px; border-radius: 5px; border-left: 4px solid #ff4081;}

        .toggle-container {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: #b388ff; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 14px;
        }
        .toggle-container input { width: 16px; height: 16px; accent-color: #b388ff; cursor: pointer; }

    </style>
</head>
<body>

<a href="index.html" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(255,255,255,0.92);border:2px solid #ddd;border-radius:50px;padding:6px 16px;font-family:'Comic Sans MS','Chalkboard SE',cursive;font-size:0.9rem;font-weight:bold;color:#555;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.13);white-space:nowrap;" title="Back to Index">🏠 Back to Index</a>

    <h1>📐 The Geometric Multiplier v2 📐</h1>
    <p>Watch lines turn into dots, and watch the dots get carried over.</p>

    <div class="dashboard">
        
        <!-- VISUAL CANVAS -->
        <div class="canvas-container">
            <canvas id="mathCanvas" width="800" height="800"></canvas>
        </div>

        <!-- CONTROLS & READOUT -->
        <div class="panel">
            <div class="input-row">
                <input type="number" id="num1" value="32" min="10" max="99">
                <span style="color: #666;">×</span>
                <input type="number" id="num2" value="24" min="10" max="99">
            </div>
            
            <button class="btn" id="btn-draw" onclick="startEngine()">Draw the Math</button>

            <div class="readout" id="readout">
                <div style="color: #888; text-align: center; margin-top: 20px;">Ready to multiply.<br>Try 32 × 24 to see carrying in action!</div>
            </div>

            <label class="toggle-container">
                <input type="checkbox" id="toggle-sound" checked onchange="initAudio()">
                🎵 Enable Sound Effects
            </label>
        </div>

    </div>

<script>
    const canvas = document.getElementById('mathCanvas');
    const ctx = canvas.getContext('2d');
    const readout = document.getElementById('readout');
    const btn = document.getElementById('btn-draw');

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // --- AUDIO ENGINE ---
    let audioCtx;
    let masterGain;

    function initAudio() {
        if (document.getElementById('toggle-sound').checked && !audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.3;
            masterGain.connect(audioCtx.destination);
        }
    }

    function playSound(type) {
        if (!audioCtx || !document.getElementById('toggle-sound').checked) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(masterGain);

        if (type === 'whoosh') { 
            osc.type = 'sine';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'pop') { 
            osc.type = 'square';
            osc.frequency.setValueAtTime(600 + Math.random()*200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'carry') { 
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.6);
        } else if (type === 'done') { 
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 1.5);
        }
    }

    // --- UTILITIES ---
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function logStep(text, style = "") {
        const div = document.createElement('div');
        div.innerHTML = text;
        if (style) div.className = style;
        readout.appendChild(div);
        readout.scrollTop = readout.scrollHeight;
    }

    const LINE_SPACING = 20;
    const OFFSET_BASE = 140;

    function generateOffsets(count, baseOffset) {
        let offsets = [];
        const start = baseOffset - ((count - 1) * LINE_SPACING) / 2;
        for (let i = 0; i < count; i++) offsets.push(start + (i * LINE_SPACING));
        return offsets;
    }

    // Finds the physical center point of a cluster of dots
    function getCenter(points) {
        if(points.length === 0) return {x: cx, y: cy};
        let sx = 0, sy = 0;
        points.forEach(p => { sx += p.x; sy += p.y; });
        return { x: sx / points.length, y: sy / points.length };
    }

    // --- VISUAL UI COMPONENTS ---

    // Draws the rigid black "Math Box" to clearly display the numbers on top of the lines
    function drawAnswerBox(label, number, x, y, subtext="", highlight=false) {
        ctx.fillStyle = highlight ? "#1a1a00" : "#111"; 
        ctx.strokeStyle = highlight ? "#ffeb3b" : "#333";
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        // Support for standard rounded rectangles
        if(ctx.roundRect) {
            ctx.roundRect(x - 65, y - 55, 130, 110, 10);
        } else {
            ctx.rect(x - 65, y - 55, 130, 110);
        }
        ctx.fill(); ctx.stroke();

        ctx.font = "bold 14px Courier New";
        ctx.fillStyle = "#888";
        ctx.textAlign = "center";
        ctx.fillText(label, x, y - 35);

        ctx.font = "bold 48px Courier New";
        ctx.fillStyle = highlight ? "#ffeb3b" : "#00e5ff";
        ctx.fillText(number, x, y + 15);

        if(subtext) {
            ctx.font = "bold 12px Courier New";
            ctx.fillStyle = "#ff4081";
            ctx.fillText(subtext, x, y + 40);
        }
    }

    // Animates the "Transport Line" and flies the badge to the next zone
    async function drawCarryArrow(startX, startY, endX, endY, amount) {
        playSound('carry');
        const steps = 30;
        const dx = endX - startX;
        const dy = endY - startY;

        // 1. Draw dashed transport line
        ctx.strokeStyle = "#ffeb3b";
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 15]);

        for(let i = 1; i <= steps; i++) {
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(startX + (dx * (i/steps)), startY + (dy * (i/steps)));
            ctx.stroke();
            await sleep(15);
        }
        ctx.setLineDash([]); // Reset dash

        // 2. Pop the glowing badge at the destination
        ctx.beginPath();
        ctx.arc(endX, endY - 70, 22, 0, Math.PI*2); // Above the target box
        ctx.fillStyle = "#ff4081";
        ctx.fill();
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ff4081";

        ctx.font = "bold 24px Courier New";
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("+" + amount, endX, endY - 70);
        ctx.shadowBlur = 0;
        ctx.textBaseline = "alphabetic"; // Reset
        
        await sleep(500);
    }


    // --- MAIN ENGINE ---
    async function startEngine() {
        btn.disabled = true;
        readout.innerHTML = '';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        initAudio();

        let n1 = document.getElementById('num1').value;
        let n2 = document.getElementById('num2').value;

        const A = parseInt(n1.charAt(0)) || 0;
        const B = parseInt(n1.charAt(1)) || 0;
        const C = parseInt(n2.charAt(0)) || 0;
        const D = parseInt(n2.charAt(1)) || 0;

        logStep(`Multiplying <span style="color:#00e5ff">${n1}</span> × <span style="color:#ff4081">${n2}</span>`, "step-highlight");

        // 1. Draw Lines
        const kA = generateOffsets(A, OFFSET_BASE); 
        const kB = generateOffsets(B, -OFFSET_BASE); 
        const kC = generateOffsets(C, -OFFSET_BASE); 
        const kD = generateOffsets(D, OFFSET_BASE); 

        async function drawLinesAnimated(offsets, slope, color, label) {
            if(offsets.length === 0) return; // Handle Zeros
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            playSound('whoosh');

            for (let k of offsets) {
                ctx.beginPath();
                let startX = -400; let startY = (slope * startX) + k;
                let endX = 400; let endY = (slope * endX) + k;
                ctx.moveTo(cx + startX, cy - startY);
                ctx.lineTo(cx + endX, cy - endY);
                ctx.stroke();
                await sleep(40);
            }
            ctx.shadowBlur = 0;
            await sleep(200);
        }

        await drawLinesAnimated(kA, 1, '#00e5ff', 'Tens');
        await drawLinesAnimated(kB, 1, '#00e5ff', 'Ones');
        await drawLinesAnimated(kC, -1, '#ff4081', 'Tens');
        await drawLinesAnimated(kD, -1, '#ff4081', 'Ones');

        // 2. Intersections
        function getIntersections(k1_arr, k2_arr) {
            let pts = [];
            for (let k1 of k1_arr) {
                for (let k2 of k2_arr) {
                    pts.push({ x: cx + ((k2 - k1) / 2), y: cy - ((k2 + k1) / 2) });
                }
            }
            return pts;
        }

        const zoneRight = getIntersections(kB, kD);
        const zoneMiddle = [...getIntersections(kA, kD), ...getIntersections(kB, kC)];
        const zoneLeft = getIntersections(kA, kC);

        async function countZone(points) {
            let count = 0;
            for (let pt of points) {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#ffeb3b';
                ctx.shadowBlur = 15; ctx.shadowColor = '#ffeb3b';
                ctx.fill();
                count++;
                playSound('pop');
                await sleep(30); 
            }
            ctx.shadowBlur = 0;
            return count;
        }

        // --- THE MATH SEQUENCE ---
        
        // Define Box Locations
        const boxRight = { x: cx + 260, y: cy };
        const boxMid = { x: cx, y: cy + 260 };
        const boxLeft = { x: cx - 260, y: cy };

        await sleep(500);

        // ** 1. ONES ZONE (RIGHT) **
        logStep(`Counting the Right Zone (Ones)...`);
        let sumRight = await countZone(zoneRight);
        let digitRight = sumRight % 10;
        let carryRight = Math.floor(sumRight / 10);
        
        drawAnswerBox("ONES", sumRight, boxRight.x, boxRight.y);

        if (carryRight > 0) {
            await sleep(800);
            logStep(`We found ${sumRight} dots. We can only keep single digits!`, "step-carry");
            logStep(`Keeping the ${digitRight}, and packaging the ${carryRight}0 dots up to send to the Tens zone...`);
            
            // Draw the transport line to the middle box!
            const centerR = getCenter(zoneRight);
            await drawCarryArrow(centerR.x, centerR.y, boxMid.x, boxMid.y, carryRight);
            
            // Update original box to show we dropped the 1
            drawAnswerBox("ONES", digitRight, boxRight.x, boxRight.y, `Carried ${carryRight} over`);
        } else {
            logStep(`Total Ones: ${digitRight}`);
        }

        await sleep(1000);

        // ** 2. TENS ZONE (MIDDLE) **
        logStep(`<br>Counting the Middle Zone (Tens)...`);
        let sumMiddle = await countZone(zoneMiddle);
        let totalMiddle = sumMiddle + carryRight;
        let digitMiddle = totalMiddle % 10;
        let carryMiddle = Math.floor(totalMiddle / 10);

        drawAnswerBox("TENS", sumMiddle, boxMid.x, boxMid.y);

        if (carryRight > 0) {
            await sleep(800);
            logStep(`Adding the ${carryRight} we carried over: ${sumMiddle} + ${carryRight} = ${totalMiddle}`);
            drawAnswerBox("TENS", totalMiddle, boxMid.x, boxMid.y, `+${carryRight} from before`, true);
        }

        if (carryMiddle > 0) {
            await sleep(1500);
            logStep(`We have ${totalMiddle} Tens. That's too big!`, "step-carry");
            logStep(`Keeping the ${digitMiddle}, and sending the ${carryMiddle} Hundreds over...`);
            
            await drawCarryArrow(boxMid.x - 50, boxMid.y, boxLeft.x, boxLeft.y, carryMiddle);
            drawAnswerBox("TENS", digitMiddle, boxMid.x, boxMid.y, `Carried ${carryMiddle} over`);
        }

        await sleep(1000);

        // ** 3. HUNDREDS ZONE (LEFT) **
        logStep(`<br>Counting the Left Zone (Hundreds)...`);
        let sumLeft = await countZone(zoneLeft);
        let totalLeft = sumLeft + carryMiddle;

        drawAnswerBox("HUNDREDS", sumLeft, boxLeft.x, boxLeft.y);

        if (carryMiddle > 0) {
            await sleep(800);
            logStep(`Adding the ${carryMiddle} we carried over: ${sumLeft} + ${carryMiddle} = ${totalLeft}`);
            drawAnswerBox("HUNDREDS", totalLeft, boxLeft.x, boxLeft.y, `+${carryMiddle} from before`, true);
        }

        await sleep(1000);

        // ** FINAL RESULT **
        const finalStr = totalLeft.toString() + digitMiddle.toString() + digitRight.toString();
        logStep(`<br>Math complete! Reading left to right:`, "step-highlight");
        
        ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
        ctx.fillRect(cx - 120, cy - 50, 240, 100);
        ctx.strokeStyle = "#00e676";
        ctx.lineWidth = 4;
        ctx.strokeRect(cx - 120, cy - 50, 240, 100);

        ctx.font = "bold 52px Courier New";
        ctx.fillStyle = "#00e676";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#00e676";
        ctx.fillText(finalStr, cx, cy);
        
        playSound('done');
        btn.disabled = false;
    }
</script>
</body>
</html>
