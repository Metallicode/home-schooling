<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Harmonic Glider</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: #050508; color: #fff;
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box; text-align: center;
        }
        
        h1 { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); margin: 0 0 5px 0; letter-spacing: 2px;}
        p { font-size: 16px; color: #b2ebf2; margin: 0 0 20px 0;}

        /* --- DASHBOARD --- */
        .dashboard {
            display: flex; flex-direction: column; width: 100%; max-width: 1000px; 
            gap: 15px; justify-content: center; align-items: center;
        }

        /* --- CONTROLS --- */
        .controls {
            display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: center;
            background: #111; padding: 15px 30px; border-radius: 15px; border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%;
        }

        .control-group { display: flex; flex-direction: column; gap: 5px; align-items: flex-start;}
        .control-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;}

        select {
            background: #222; color: #fff; border: 1px solid #444; padding: 10px 15px;
            border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; cursor: pointer;
        }
        select:focus { border-color: #00e5ff; }

        /* --- READOUT PANEL --- */
        .readout-panel {
            width: 100%; min-height: 80px; background: #0a0a0d; border-radius: 15px;
            border: 1px solid #222; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .readout-chord { font-size: 32px; font-weight: bold; letter-spacing: 1px; transition: color 0.2s;}
        .readout-notes { font-size: 14px; color: #888; letter-spacing: 2px; text-transform: uppercase;}
        
        /* --- GRID CONTAINER --- */
        .grid-wrapper {
            width: 100%; background: #0a0a0d; padding: 15px; border-radius: 15px; 
            border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .grid-container {
            display: grid; 
            /* 1 column for Y-axis, 7 columns for chords */
            grid-template-columns: 80px repeat(7, 1fr); 
            gap: 6px; width: 100%; height: 500px;
        }

        .header-cell {
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #666; text-transform: uppercase; font-weight: bold;
            user-select: none; text-align: center; line-height: 1.2;
        }

        .chord-cell {
            border-radius: 8px; cursor: crosshair; transition: all 0.2s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5); opacity: 0.6;
            background-color: #1a1a1a; /* Default base */
        }

        /* Quality Color Classes (Minimalist) */
        .q-major { background-color: #006b78; border: 1px solid #009eb0; }
        .q-major:hover { background-color: #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.6); opacity: 1; transform: scale(1.05); z-index: 10;}
        
        .q-minor { background-color: #5c3b8a; border: 1px solid #7c52b8; }
        .q-minor:hover { background-color: #b388ff; box-shadow: 0 0 20px rgba(179, 136, 255, 0.6); opacity: 1; transform: scale(1.05); z-index: 10;}
        
        .q-dim { background-color: #8a2424; border: 1px solid #ba3636; }
        .q-dim:hover { background-color: #ff5252; box-shadow: 0 0 20px rgba(255, 82, 82, 0.6); opacity: 1; transform: scale(1.05); z-index: 10;}

        .q-aug { background-color: #007a3f; border: 1px solid #00a656; }
        .q-aug:hover { background-color: #00e676; box-shadow: 0 0 20px rgba(0, 230, 118, 0.6); opacity: 1; transform: scale(1.05); z-index: 10;}

        .toggle-container {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: #ffeb3b; font-weight: bold; cursor: pointer; font-size: 14px;
            margin-left: auto; /* Push to right */
        }
        .toggle-container input { width: 16px; height: 16px; accent-color: #ffeb3b; cursor: pointer; }

    </style>
</head>
<body>

<a href="index.html" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(255,255,255,0.92);border:2px solid #ddd;border-radius:50px;padding:6px 16px;font-family:'Comic Sans MS','Chalkboard SE',cursive;font-size:0.9rem;font-weight:bold;color:#555;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.13);white-space:nowrap;" title="Back to Index">🏠 Back to Index</a>

    <h1>✨ The Harmonic Glider ✨</h1>
    <p>Glide over the colors. Major is Cyan, Minor is Purple, Diminished is Red.</p>

    <div class="dashboard">
        
        <div class="controls">
            <div class="control-group">
                <div class="control-label">Root Note</div>
                <select id="root-select" onchange="buildGrid()">
                    <option value="0">C</option>
                    <option value="1">C# / Db</option>
                    <option value="2">D</option>
                    <option value="3">D# / Eb</option>
                    <option value="4">E</option>
                    <option value="5">F</option>
                    <option value="6">F# / Gb</option>
                    <option value="7">G</option>
                    <option value="8">G# / Ab</option>
                    <option value="9">A</option>
                    <option value="10">A# / Bb</option>
                    <option value="11">B</option>
                </select>
            </div>

            <div class="control-group">
                <div class="control-label">Mode / Scale</div>
                <select id="scale-select" onchange="buildGrid()">
                    <option value="major">Major (Ionian)</option>
                    <option value="minor">Natural Minor (Aeolian)</option>
                    <option value="harmonic">Harmonic Minor</option>
                    <option value="dorian">Dorian Mode</option>
                    <option value="phrygian">Phrygian Mode</option>
                    <option value="lydian">Lydian Mode</option>
                    <option value="mixolydian">Mixolydian Mode</option>
                </select>
            </div>
            
            <label class="toggle-container">
                <input type="checkbox" id="toggle-sound" checked onchange="initAudio()">
                🎵 Enable Engine
            </label>
        </div>

        <div class="readout-panel" id="readout">
            <div class="readout-chord" id="rd-chord" style="color: #444;">Hover over the grid</div>
            <div class="readout-notes" id="rd-notes">--</div>
        </div>

        <div class="grid-wrapper">
            <div class="grid-container" id="grid">
                </div>
        </div>
    </div>

<script>
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    
    const SCALES = {
        "major": [0, 2, 4, 5, 7, 9, 11],
        "minor": [0, 2, 3, 5, 7, 8, 10],
        "harmonic": [0, 2, 3, 5, 7, 8, 11],
        "dorian": [0, 2, 3, 5, 7, 9, 10],
        "phrygian": [0, 1, 3, 5, 7, 8, 10],
        "lydian": [0, 2, 4, 6, 7, 9, 11],
        "mixolydian": [0, 2, 4, 5, 7, 9, 10]
    };

    const ROMAN_MAJOR = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
    const ROMAN_MINOR = ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii°'];
    
    // --- AUDIO ENGINE ---
    let audioCtx = null;
    let convolver = null;
    let masterGain = null;
    let compressor = null;

    function createReverb() {
        const length = audioCtx.sampleRate * 2.5; 
        const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
        const left = impulse.getChannelData(0);
        const right = impulse.getChannelData(1);
        for (let i = 0; i < length; i++) {
            const decay = Math.exp(-i / (audioCtx.sampleRate * 0.5));
            left[i] = (Math.random() * 2 - 1) * decay;
            right[i] = (Math.random() * 2 - 1) * decay;
        }
        let conv = audioCtx.createConvolver();
        conv.buffer = impulse;
        return conv;
    }

    function initAudio() {
        if (document.getElementById('toggle-sound').checked && !audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // The Compressor prevents distortion when chords stack
            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
            compressor.knee.setValueAtTime(30, audioCtx.currentTime);
            compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
            compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
            compressor.release.setValueAtTime(0.25, audioCtx.currentTime);
            compressor.connect(audioCtx.destination);

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.25; // Lowered baseline gain
            
            convolver = createReverb();
            
            // Routing: Gain -> (Dry directly to compressor) + (Wet through reverb to compressor)
            masterGain.connect(compressor);
            masterGain.connect(convolver);
            convolver.connect(compressor);
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    // SynthVoice with Infinite Sustain on Hover
    class SynthVoice {
        constructor(midiNote) {
            this.osc1 = audioCtx.createOscillator();
            this.osc2 = audioCtx.createOscillator();
            this.gainNode = audioCtx.createGain();
            this.filter = audioCtx.createBiquadFilter();

            const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
            
            this.osc1.type = 'sine';
            this.osc2.type = 'triangle';
            this.osc1.frequency.value = freq;
            this.osc2.frequency.value = freq;

            this.filter.type = 'lowpass';
            this.filter.frequency.value = 800;

            this.osc1.connect(this.gainNode);
            this.osc2.connect(this.gainNode);
            this.gainNode.connect(this.filter);
            this.filter.connect(masterGain);

            this.gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            this.osc1.start();
            this.osc2.start();
        }

        play() {
            const now = audioCtx.currentTime;
            this.gainNode.gain.cancelScheduledValues(now);
            this.gainNode.gain.setValueAtTime(this.gainNode.gain.value, now);
            // Swells gently to full volume and holds it indefinitely while hovering
            this.gainNode.gain.linearRampToValueAtTime(0.12, now + 0.15); 
        }

        stop() {
            const now = audioCtx.currentTime;
            this.gainNode.gain.cancelScheduledValues(now);
            this.gainNode.gain.setValueAtTime(this.gainNode.gain.value, now);
            // Smoothly fades out when mouse leaves
            this.gainNode.gain.linearRampToValueAtTime(0, now + 0.4);
            
            // Clean up to prevent memory leaks
            setTimeout(() => {
                this.osc1.stop(); this.osc2.stop();
                this.osc1.disconnect(); this.osc2.disconnect();
            }, 500);
        }
    }

    // --- GRID LOGIC ---
    function getMidiFromScale(baseMidi, intervals, degree) {
        let oct = Math.floor(degree / 7);
        let idx = degree % 7;
        return baseMidi + intervals[idx] + (oct * 12);
    }

    function midiToName(midi) {
        return NOTE_NAMES[midi % 12];
    }

    function buildGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        
        const rootIndex = parseInt(document.getElementById('root-select').value);
        const scaleKey = document.getElementById('scale-select').value;
        const intervals = SCALES[scaleKey];
        const baseMidi = 48 + rootIndex; 
        
        // --- X-AXIS HEADERS ---
        const corner = document.createElement('div');
        grid.appendChild(corner); // Top left empty
        for (let i = 0; i < 7; i++) {
            const h = document.createElement('div');
            h.className = 'header-cell';
            h.innerText = ROMAN_MAJOR[i]; // Just generic markers for the columns
            grid.appendChild(h);
        }

        // --- GRID BODY ---
        const invLabels = ["Root", "1st Inv", "2nd Inv"];

        for (let row = 0; row < 9; row++) {
            let invertedRow = 8 - row; 
            let octOffset = Math.floor(invertedRow / 3);
            let inversion = invertedRow % 3;

            // Y-AXIS HEADER
            const yHeader = document.createElement('div');
            yHeader.className = 'header-cell';
            yHeader.innerHTML = `Oct ${octOffset+3}<br>${invLabels[inversion]}`;
            grid.appendChild(yHeader);

            // CHORD CELLS
            for (let deg = 0; deg < 7; deg++) {
                let r = getMidiFromScale(baseMidi, intervals, deg);
                let t = getMidiFromScale(baseMidi, intervals, deg + 2);
                let f = getMidiFromScale(baseMidi, intervals, deg + 4);

                let diff3 = t - r;
                let diff5 = f - r;
                let quality = "dim";
                let roman = ROMAN_MINOR[deg]; 
                let hexColor = "#ff5252";
                
                if (diff3 === 4 && diff5 === 7) { quality = "major"; roman = ROMAN_MAJOR[deg]; hexColor = "#00e5ff"; }
                else if (diff3 === 3 && diff5 === 7) { quality = "minor"; hexColor = "#b388ff"; }
                else if (diff3 === 4 && diff5 === 8) { quality = "aug"; roman = ROMAN_MAJOR[deg] + "+"; hexColor = "#00e676"; }

                const chordName = `${NOTE_NAMES[r%12]} ${roman}`;
                const noteNames = `${midiToName(r)} • ${midiToName(t)} • ${midiToName(f)}`;

                if (inversion === 1) { r += 12; }
                if (inversion === 2) { r += 12; t += 12; }

                r += octOffset * 12;
                t += octOffset * 12;
                f += octOffset * 12;

                const cell = document.createElement('div');
                cell.className = `chord-cell q-${quality}`;
                
                let activeVoices = [];
                
                cell.onmouseenter = () => {
                    initAudio();
                    // Update Readout UI
                    document.getElementById('rd-chord').innerText = chordName;
                    document.getElementById('rd-chord').style.color = hexColor;
                    document.getElementById('rd-notes').innerText = noteNames;

                    if(!audioCtx) return;
                    activeVoices = [new SynthVoice(r), new SynthVoice(t), new SynthVoice(f)];
                    activeVoices.forEach(v => v.play());
                };

                cell.onmouseleave = () => {
                    activeVoices.forEach(v => v.stop());
                    activeVoices = [];
                };

                grid.appendChild(cell);
            }
        }
    }

    buildGrid();

</script>
</body>
</html>
