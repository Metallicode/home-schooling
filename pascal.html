<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pascal Prism - V3</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: #050508; color: #fff;
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box; text-align: center;
        }
        
        h1 { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); margin: 0 0 5px 0; letter-spacing: 2px;}
        p { font-size: 16px; color: #b2ebf2; margin: 0 0 15px 0;}

        /* --- DASHBOARD --- */
        .dashboard {
            display: flex; flex-direction: column; width: 100%; max-width: 1200px; 
            gap: 15px; justify-content: center; align-items: center;
        }

        /* --- READOUT PANEL & CONCEPT VISUALIZER --- */
        .readout-panel {
            background: #111; padding: 15px 30px; border-radius: 15px; 
            border: 1px solid #333; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            width: 100%; max-width: 800px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 140px; position: relative;
        }
        
        .readout-equation { 
            font-size: 28px; font-weight: bold; color: #ffeb3b; 
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.4); letter-spacing: 1px; z-index: 2;
        }
        .readout-desc { color: #00e5ff; font-size: 15px; margin-top: 5px; font-weight: bold; z-index: 2;}

        /* Concept Visualizer Container */
        #concept-box {
            margin-top: 15px; min-height: 80px; display: flex; justify-content: center; align-items: center;
        }

        /* --- CONTROLS --- */
        .control-group {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
            background: #111; padding: 15px; border-radius: 10px; border: 1px solid #222;
        }
        .control-label { width: 100%; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }

        .btn {
            background: #222; color: #fff; border: 1px solid #444; border-radius: 8px;
            padding: 10px 15px; font-size: 13px; font-family: inherit; font-weight: bold;
            cursor: pointer; transition: all 0.2s; text-transform: uppercase;
        }
        .btn:hover { background: #333; }
        .btn.active-diag { background: #ff4081; color: #fff; border-color: #ff4081; box-shadow: 0 0 15px rgba(255, 64, 129, 0.5); }
        .btn.active-odd { background: #00e676; color: #000; border-color: #00e676; box-shadow: 0 0 15px rgba(0, 230, 118, 0.5); }

        /* --- TRIANGLE CONTAINER --- */
        .triangle-container {
            position: relative; padding: 40px; background: #0a0a0d; 
            border-radius: 15px; border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%; overflow-x: auto; 
        }

        /* Increased margins between rows! */
        #triangle-wrapper {
            position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px;
        }

        /* Two distinct SVG layers so hover lines don't erase pattern lines */
        .svg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: visible;
        }
        #pattern-canvas { z-index: 1; }
        #hover-canvas { z-index: 3; } /* Hover lines draw OVER the nodes */

        /* Increased margins between nodes! */
        .row {
            display: flex; justify-content: center; gap: 12px; position: relative; z-index: 2;
        }

        .node {
            width: 45px; height: 45px; background: #1a1a1a; border: 2px solid #333;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 14px; font-weight: bold; color: #ccc; cursor: pointer;
            transition: all 0.2s ease; user-select: none; z-index: 2;
        }

        .node:hover { transform: scale(1.3); color: #fff; background: #222; z-index: 20;}

        /* Hover States */
        .node.active-child {
            background: #ffeb3b; color: #000; border-color: #ffeb3b;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.8) !important; z-index: 10;
        }
        .node.active-parent {
            background: rgba(0, 229, 255, 0.9); color: #000; border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.8) !important; z-index: 10;
        }
        
        /* Pattern States */
        .node.diag-highlight {
            background: rgba(255, 64, 129, 0.8); color: #fff; border-color: #ff4081;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.8);
        }
        .node.odd-highlight {
            background: rgba(0, 230, 118, 0.2); color: #00e676; border-color: #00e676;
        }

        .toggle-container {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: #b388ff; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 14px;
        }
        .toggle-container input { width: 16px; height: 16px; accent-color: #b388ff; cursor: pointer; }

        /* --- CONCEPT VISUALIZER CSS (The Dots) --- */
        .v-dot {
            width: 15px; height: 15px; background: #ff4081; border-radius: 50%;
            box-shadow: 0 0 10px #ff4081; display: inline-block; margin: 2px;
        }
        .v-row { display: flex; justify-content: center; }
        
        /* 3D Isometric View for Pyramids! */
        .iso-container {
            perspective: 800px; transform-style: preserve-3d;
            width: 100px; height: 80px; position: relative;
        }
        .iso-pyramid {
            width: 100%; height: 100%; position: absolute;
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateZ(45deg);
            animation: float 4s ease-in-out infinite;
        }
        .iso-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .iso-l1 { transform: translateZ(40px); }
        .iso-l2 { transform: translateZ(20px); }
        .iso-l3 { transform: translateZ(0px); }
        
        @keyframes float {
            0%, 100% { transform: rotateX(60deg) rotateZ(45deg) translateZ(0px); }
            50% { transform: rotateX(60deg) rotateZ(45deg) translateZ(15px); }
        }

    </style>
</head>
<body>

<a href="index.html" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(255,255,255,0.92);border:2px solid #ddd;border-radius:50px;padding:6px 16px;font-family:'Comic Sans MS','Chalkboard SE',cursive;font-size:0.9rem;font-weight:bold;color:#555;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.13);white-space:nowrap;" title="Back to Index">🏠 Back to Index</a>

    <h1>💎 The Pascal Prism v3 💎</h1>
    <p>Hover to see ancestry math, or click diagonals to explore dimensions.</p>

    <div class="dashboard">
        
        <div class="readout-panel">
            <div class="readout-equation" id="equation">Explore the Grid</div>
            <div class="readout-desc" id="desc">Hover over any number to see its two parent numbers.</div>
            <div id="concept-box"></div>
        </div>

        <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%;">
            <div class="control-group">
                <div class="control-label">Dimensions of Geometry</div>
                <button class="btn" id="btn-d0" onclick="highlightDiagonal(0)">0D: Points</button>
                <button class="btn" id="btn-d1" onclick="highlightDiagonal(1)">1D: Lines</button>
                <button class="btn" id="btn-d2" onclick="highlightDiagonal(2)">2D: Triangles</button>
                <button class="btn" id="btn-d3" onclick="highlightDiagonal(3)">3D: Pyramids</button>
            </div>

            <div class="control-group">
                <div class="control-label">Fractals</div>
                <button class="btn" id="btn-odd" onclick="highlightOdds()">Sierpinski Fractal</button>
                <button class="btn" onclick="clearAll()" style="border-color: #ff5252; color: #ff5252;">Reset</button>
            </div>
        </div>

        <div class="triangle-container" id="container">
            <div id="triangle-wrapper">
                <svg id="pattern-canvas" class="svg-layer"></svg>
                <svg id="hover-canvas" class="svg-layer"></svg>
                </div>
        </div>

        <label class="toggle-container">
            <input type="checkbox" id="toggle-sound" checked onchange="initAudio()">
            🎵 Enable Synesthesia
        </label>

    </div>

<script>
    const ROWS = 13; 
    const triangleData = [];
    const nodeElements = [];
    
    const wrapper = document.getElementById('triangle-wrapper');
    const patternCanvas = document.getElementById('pattern-canvas');
    const hoverCanvas = document.getElementById('hover-canvas');
    const equationText = document.getElementById('equation');
    const descText = document.getElementById('desc');
    const conceptBox = document.getElementById('concept-box');
    
    let activeMode = null; 
    let baseEquationText = "Explore the Grid";
    let baseDescText = "Hover over any number to see its two parent numbers.";

    // --- AUDIO ENGINE ---
    let audioCtx;
    let masterGain;

    function initAudio() {
        if (document.getElementById('toggle-sound').checked && !audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.2;
            masterGain.connect(audioCtx.destination);
        }
    }

    function playHoverSound(val) {
        if (!audioCtx || !document.getElementById('toggle-sound').checked) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(masterGain);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(Math.max(150, 800 - (val * 2)), audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
    }

    // --- GENERATE TRIANGLE ---
    function buildTriangle() {
        for (let r = 0; r < ROWS; r++) {
            let rowData = [];
            let rowNodes = [];
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';

            for (let c = 0; c <= r; c++) {
                let val = 1;
                if (c > 0 && c < r) val = triangleData[r - 1][c - 1] + triangleData[r - 1][c];
                rowData.push(val);

                const node = document.createElement('div');
                node.className = 'node';
                node.innerText = val;
                node.dataset.row = r;
                node.dataset.col = c;
                node.dataset.val = val;

                // THE FIX: Hover always works, completely decoupled from the diagonal state
                node.addEventListener('mouseenter', handleHover);
                node.addEventListener('mouseleave', clearHover);

                rowDiv.appendChild(node);
                rowNodes.push(node);
            }
            wrapper.appendChild(rowDiv);
            triangleData.push(rowData);
            nodeElements.push(rowNodes);
        }
    }

    // --- HOVER LOGIC (ANCESTRY LINES) ---
    function handleHover(e) {
        if (!audioCtx && document.getElementById('toggle-sound').checked) initAudio();
        
        const target = e.target;
        const r = parseInt(target.dataset.row);
        const c = parseInt(target.dataset.col);
        const val = parseInt(target.dataset.val);
        
        playHoverSound(val);
        target.classList.add('active-child');
        hoverCanvas.innerHTML = ''; 

        if (r > 0) {
            let val1 = 0, val2 = 0;
            if (c > 0) {
                const p1 = nodeElements[r - 1][c - 1];
                p1.classList.add('active-parent');
                val1 = triangleData[r - 1][c - 1];
                drawHoverLine(p1, target);
            }
            if (c < r) {
                const p2 = nodeElements[r - 1][c];
                p2.classList.add('active-parent');
                val2 = triangleData[r - 1][c];
                drawHoverLine(p2, target);
            }
            // Temporarily override the readout panel
            equationText.innerHTML = `<span style="color:#00e5ff">${val1}</span> + <span style="color:#00e5ff">${val2}</span> = <span style="color:#ffeb3b">${val}</span>`;
            descText.innerText = "Hover Logic: Add the two parents directly above.";
        } else {
            equationText.innerHTML = `<span style="color:#ffeb3b">1</span>`;
            descText.innerText = "The Origin Point.";
        }
    }

    function clearHover() {
        document.querySelectorAll('.node').forEach(n => n.classList.remove('active-child', 'active-parent'));
        hoverCanvas.innerHTML = '';
        
        // Restore the readout text to whatever the active pattern is (or the default)
        equationText.innerHTML = baseEquationText;
        descText.innerText = baseDescText;
    }

    // Draws the glowing hover lines on the top SVG layer
    function drawHoverLine(el1, el2) {
        const wrapperRect = wrapper.getBoundingClientRect();
        const rect1 = el1.getBoundingClientRect();
        const rect2 = el2.getBoundingClientRect();

        const x1 = rect1.left + (rect1.width / 2) - wrapperRect.left;
        const y1 = rect1.top + (rect1.height / 2) - wrapperRect.top;
        const x2 = rect2.left + (rect2.width / 2) - wrapperRect.left;
        const y2 = rect2.top + (rect2.height / 2) - wrapperRect.top;

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1); line.setAttribute("y1", y1);
        line.setAttribute("x2", x2); line.setAttribute("y2", y2);
        line.setAttribute("stroke", "#00e5ff");
        line.setAttribute("stroke-width", "5");
        line.style.filter = `drop-shadow(0px 0px 8px #00e5ff)`;
        hoverCanvas.appendChild(line);
    }

    // Draws the solid pink line for diagonals on the bottom SVG layer
    function drawPatternPath(nodes) {
        if(nodes.length < 2) return;
        const wrapperRect = wrapper.getBoundingClientRect();
        let d = "";
        
        nodes.forEach((el, i) => {
            const rect = el.getBoundingClientRect();
            const x = rect.left + (rect.width/2) - wrapperRect.left;
            const y = rect.top + (rect.height/2) - wrapperRect.top;
            d += (i === 0 ? "M " : "L ") + x + " " + y;
        });

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("stroke", "#ff4081");
        path.setAttribute("stroke-width", "6");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke-linejoin", "round");
        patternCanvas.appendChild(path);
    }

    // --- PATTERNS & CONCEPT VISUALIZER ---
    function resetUI() {
        document.querySelectorAll('.node').forEach(n => n.classList.remove('diag-highlight', 'odd-highlight'));
        ['btn-d0', 'btn-d1', 'btn-d2', 'btn-d3', 'btn-odd'].forEach(id => document.getElementById(id).classList.remove('active-diag', 'active-odd'));
        patternCanvas.innerHTML = '';
        conceptBox.innerHTML = '';
        activeMode = null;
    }

    function clearAll() {
        resetUI();
        baseEquationText = "Explore the Grid";
        baseDescText = "Hover over any number to see its two parent numbers.";
        equationText.innerHTML = baseEquationText;
        descText.innerText = baseDescText;
    }

    // Generates the physical dot models
    function renderConcept(dimension) {
        if(dimension === 0) {
            conceptBox.innerHTML = '<div class="v-dot"></div>';
        } else if (dimension === 1) {
            conceptBox.innerHTML = '<div style="display:flex; gap:10px;"><div class="v-dot"></div><div class="v-dot"></div><div class="v-dot"></div><div class="v-dot"></div></div>';
        } else if (dimension === 2) {
            conceptBox.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div class="v-row"><div class="v-dot"></div></div>
                    <div class="v-row"><div class="v-dot"></div><div class="v-dot"></div></div>
                    <div class="v-row"><div class="v-dot"></div><div class="v-dot"></div><div class="v-dot"></div></div>
                </div>`;
        } else if (dimension === 3) {
            // CSS 3D Isometric Pyramid!
            conceptBox.innerHTML = `
                <div class="iso-container">
                    <div class="iso-pyramid">
                        <div class="iso-layer iso-l1"><div class="v-row"><div class="v-dot" style="background:#00e5ff; box-shadow:0 0 10px #00e5ff;"></div></div></div>
                        <div class="iso-layer iso-l2">
                            <div class="v-row"><div class="v-dot" style="background:#ffeb3b; box-shadow:0 0 10px #ffeb3b;"></div></div>
                            <div class="v-row"><div class="v-dot" style="background:#ffeb3b; box-shadow:0 0 10px #ffeb3b;"></div><div class="v-dot" style="background:#ffeb3b; box-shadow:0 0 10px #ffeb3b;"></div></div>
                        </div>
                        <div class="iso-layer iso-l3">
                            <div class="v-row"><div class="v-dot"></div></div>
                            <div class="v-row"><div class="v-dot"></div><div class="v-dot"></div></div>
                            <div class="v-row"><div class="v-dot"></div><div class="v-dot"></div><div class="v-dot"></div></div>
                        </div>
                    </div>
                </div>`;
        }
    }

    function highlightDiagonal(dIndex) {
        if (!audioCtx && document.getElementById('toggle-sound').checked) initAudio();
        resetUI();
        activeMode = 'diag';

        document.getElementById(`btn-d${dIndex}`).classList.add('active-diag');
        let diagonalNodes = [];

        nodeElements.forEach(row => {
            row.forEach(node => {
                if (parseInt(node.dataset.col) === dIndex) {
                    node.classList.add('diag-highlight');
                    diagonalNodes.push(node);
                }
            });
        });

        drawPatternPath(diagonalNodes);
        renderConcept(dIndex);

        if (dIndex === 0) {
            baseEquationText = "Zero Dimensions: 1s";
            baseDescText = "A single point in space. No length, no width, no depth.";
        } else if (dIndex === 1) {
            baseEquationText = "One Dimension: Lines";
            baseDescText = "The Counting Numbers (1, 2, 3, 4...). Distance from a starting point.";
        } else if (dIndex === 2) {
            baseEquationText = "Two Dimensions: Triangles";
            baseDescText = "Triangular Numbers (1, 3, 6, 10...). The exact number of dots needed to draw flat triangles.";
        } else if (dIndex === 3) {
            baseEquationText = "Three Dimensions: Pyramids";
            baseDescText = "Tetrahedral Numbers (1, 4, 10, 20...). The exact number of spheres needed to stack a 3D pyramid.";
        }
        
        equationText.innerHTML = baseEquationText;
        descText.innerText = baseDescText;
    }

    function highlightOdds() {
        if (!audioCtx && document.getElementById('toggle-sound').checked) initAudio();
        resetUI();
        activeMode = 'odd';

        document.getElementById('btn-odd').classList.add('active-odd');

        nodeElements.forEach(row => {
            row.forEach(node => {
                if (parseInt(node.dataset.val) % 2 !== 0) node.classList.add('odd-highlight');
            });
        });

        baseEquationText = "The Sierpinski Triangle";
        baseDescText = "If you color only the Odd numbers, a perfect infinite fractal appears!";
        equationText.innerHTML = baseEquationText;
        descText.innerText = baseDescText;
    }

    buildTriangle();
    window.addEventListener('resize', () => {
        // Redraw lines safely if window resizes
        if(activeMode === 'diag') {
            const activeBtn = document.querySelector('.active-diag');
            if(activeBtn) activeBtn.click();
        }
    });

</script>
</body>
</html>
