<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Skyline Equalizer</title>
    <style>
        :root { --unit: 16px; --target: 8; }

        * { box-sizing: border-box; }

        body {
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center;
            background-color: #050508; color: #fff;
            margin: 0; padding: 16px; min-height: 100vh; text-align: center;
            overscroll-behavior: none;
        }

        h1 { color: #00e5ff; text-shadow: 0 0 15px rgba(0,229,255,.5); margin: 0 0 4px; letter-spacing: 2px; font-size: clamp(20px, 5vw, 30px); }
        p.intro { font-size: 13px; color: #b2ebf2; margin: 0 0 16px; max-width: 560px; line-height: 1.5; }

        .btn {
            background: #ffeb3b; color: #000; border: none; padding: 10px 20px;
            font: inherit; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 15px rgba(255,235,59,.4); text-transform: uppercase; letter-spacing: 1px;
            transition: transform .1s;
        }
        .btn:active { transform: scale(.95); }
        .btn.sm { padding: 8px 14px; font-size: 12px; box-shadow: none; }
        .btn:disabled { opacity: .35; cursor: default; }

        /* --- HUD --- */
        .hud {
            display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
            background: #111; border: 1px solid #2a2a30; border-radius: 12px;
            padding: 10px 16px; margin-bottom: 14px; width: min(940px, 100%);
        }
        .chip { font-size: 13px; letter-spacing: 1px; color: #8b98a5; text-transform: uppercase; }
        .chip b { color: #fff; font-size: 16px; }
        .chip.line b { color: #ff4081; text-shadow: 0 0 12px rgba(255,64,129,.6); }
        .chip.moves b { color: #00e5ff; }
        #par-num { color: #6b7580; }

        /* --- PLAY AREA --- */
        .play-area { position: relative; width: min(940px, 100%); }

        .skyline {
            position: relative; width: 100%;
            height: clamp(250px, 48vh, 360px);
            background: #0a0a0d; border: 1px solid #1e1e24; border-radius: 14px;
            box-shadow: inset 0 0 40px rgba(0,0,0,.8);
            display: flex; justify-content: space-evenly; align-items: flex-end;
            padding: 0 10px; overflow: hidden;
        }

        .target-line {
            position: absolute; left: 0; right: 0;
            bottom: calc(12px + (var(--target) * var(--unit)));
            height: 0; border-top: 3px dashed #ff4081;
            box-shadow: 0 0 16px #ff4081; z-index: 5; pointer-events: none;
        }
        .target-line span {
            position: absolute; right: 8px; top: -22px; color: #ff4081;
            font-weight: bold; font-size: 14px; text-shadow: 0 0 10px #ff4081;
        }

        /* --- TOWERS --- */
        .tower {
            position: relative; height: 100%;
            width: clamp(48px, 15vw, 88px);
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            transition: background .15s;
        }
        .tower.drop-target { background: rgba(255,255,255,.07); border-radius: 10px; }
        .tower.perfect-fit { background: rgba(105,240,174,.12); outline: 2px dashed rgba(105,240,174,.55); border-radius: 10px; }
        .tower.would-fuse  { background: rgba(255,82,82,.10);  outline: 2px dashed rgba(255,82,82,.45);  border-radius: 10px; }
        .tower.wobble { animation: wobble .4s ease; }
        @keyframes wobble {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-6px); } 40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); } 80% { transform: translateX(2px); }
        }
        .tower.reject { animation: wobble .35s ease; }
        .tower.reject .tower-base { background: #ff5252; box-shadow: 0 0 18px rgba(255,82,82,.8); }

        .stack {
            position: relative; z-index: 3; width: 82%;
            display: flex; flex-direction: column-reverse; justify-content: flex-start;
            margin-bottom: 12px;
        }

        .tower-base {
            position: absolute; bottom: 0; left: 0; right: 0; height: 12px;
            background: linear-gradient(180deg, #2a2f3a, #0f1219);
            border-radius: 0 0 5px 5px; z-index: 4;
        }

        .tower-hint {
            position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
            width: 100%; font-weight: bold; line-height: 1.15; z-index: 7;
            text-align: center; pointer-events: none;
        }
        .tower-hint .row { display: block; }
        .tower-hint .hs { font-size: 16px; }
        .tower-hint .ht { font-size: 11px; opacity: .55; }
        .tower-hint .hd { font-size: 12px; margin-right: 3px; }
        .tower-hint .hi { font-size: 13px; }
        .tower-hint.under { color: #ffca28; }
        .tower-hint.ok    { color: #69f0ae; text-shadow: 0 0 10px rgba(105,240,174,.6); }
        .tower-hint.over  { color: #ff5252; text-shadow: 0 0 10px rgba(255,82,82,.7); }
        .tower.perfect-fit .tower-hint { animation: pulseText 1s ease-in-out infinite; }
        @keyframes pulseText { 50% { transform: translateX(-50%) scale(1.16); } }

        /* --- PIECES --- */
        .piece {
            --val: 1;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #08131a; font-family: inherit;
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
            touch-action: none; cursor: grab;
        }
        .piece:active { cursor: grabbing; }

        .stack .piece {
            width: 100%; height: calc(var(--val) * var(--unit)); min-height: 12px;
            border-radius: 5px; margin-top: 2px;
            font-size: clamp(10px, calc(var(--unit) * 0.85), 15px);
            box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), inset 0 0 12px rgba(255,255,255,.22);
        }
        .drag-clone {
            width: 44px; height: 44px; border-radius: 50%; font-size: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,.6), inset 0 0 10px rgba(255,255,255,.45);
        }

        .piece.v1 { background: #f5f5f5; }
        .piece.v2 { background: #66bb6a; }
        .piece.v3 { background: #29b6f6; }
        .piece.v4 { background: #ab47bc; color: #fff; }
        .piece.v5 { background: #ffa726; }
        .piece.v6 { background: #ff5252; color: #fff; }

        .piece.dragging { opacity: .2; }
        .piece.selected { outline: 3px solid #ffeb3b; outline-offset: 2px; box-shadow: 0 0 18px #ffeb3b; z-index: 20; }

        .tower.perfect .stack .piece { box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 0 14px rgba(255,64,129,.7); }
        .tower.over    { background: rgba(255,82,82,.08); }
        .tower.over    .stack .piece { box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 0 12px rgba(255,82,82,.65); }

        /* --- OVERLAY --- */
        .win-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,.88);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity .4s; border-radius: 14px;
        }
        .win-overlay.show { opacity: 1; pointer-events: auto; }
        .win-title { font-size: clamp(26px, 7vw, 52px); color: #ffeb3b; text-shadow: 0 0 30px #ffeb3b; }
        .win-stars { font-size: 34px; letter-spacing: 8px; color: #ffeb3b; text-shadow: 0 0 20px #ffeb3b; }
        .win-sub { color: #b2ebf2; letter-spacing: 1px; font-size: 14px; }
        .win-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

        .toggle-container {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: #ffeb3b; font-weight: bold; cursor: pointer; margin-top: 16px; font-size: 13px;
        }
        .toggle-container input { width: 16px; height: 16px; accent-color: #ffeb3b; cursor: pointer; }

        /* --- FX --- */
        .spark {
            position: fixed; width: 9px; height: 9px; border-radius: 50%;
            pointer-events: none; z-index: 2000;
            transition: transform .6s ease-out, opacity .6s ease-out;
        }
        .confetti {
            position: fixed; top: -20px; width: 9px; height: 14px; z-index: 1500;
            pointer-events: none; animation: confettiFall 2.6s linear forwards;
        }
        @keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); } }

        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after { animation-duration: .001s !important; transition-duration: .001s !important; }
        }
    </style>
</head>
<body>

<a href="index.html" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(10,10,13,0.9);border:2px solid #00e5ff;border-radius:50px;padding:6px 16px;font-family:'Courier New',Courier,monospace;font-size:0.85rem;font-weight:bold;color:#00e5ff;text-decoration:none;box-shadow:0 0 15px rgba(0,229,255,0.35);white-space:nowrap;" title="Back to Index">🏠 Back to Index</a>

    <h1>🌆 The Skyline Equalizer 🌆</h1>
    <p class="intro">Move balls between the towers until <b>every</b> tower reaches the glowing line.
       There is no spare pile — to fill one tower you must borrow from another. Go over the line and the tower blows a fuse ⚡</p>

    <div class="hud">
        <div class="chip">Level <b id="level-num">1</b></div>
        <div class="chip line">Line <b id="target-num">8</b></div>
        <div class="chip moves">Moves <b id="move-num">0</b> <span id="par-num">par 4</span></div>
        <button class="btn sm" id="btn-undo">↶ Undo</button>
        <button class="btn sm" id="btn-reset">↺ Reset</button>
    </div>

    <div class="play-area">
        <div class="skyline" id="skyline">
            <div class="target-line" id="target-line"><span id="target-line-label">8</span></div>
        </div>

        <div class="win-overlay" id="win-screen">
            <div class="win-title">CITY BALANCED! 🎉</div>
            <div class="win-stars" id="win-stars">★★★</div>
            <div class="win-sub" id="win-detail"></div>
            <div class="win-btns">
                <button class="btn sm" id="btn-retry">↺ Retry</button>
                <button class="btn" id="btn-next">Next Level →</button>
            </div>
        </div>
    </div>

    <label class="toggle-container">
        <input type="checkbox" id="toggle-sound" checked>
        🎵 Enable Audio
    </label>

<script>
(function () {
    'use strict';

    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // A tower may not be pushed more than this far above the line. CAP >= 6
    // guarantees a legal move always exists (any ball fits any under-line
    // tower), so the puzzle can never deadlock — and it keeps stacks in frame.
    var OVER_CAP = 6;

    /* ================= AUDIO ================= */
    var audioCtx, masterGain;
    var soundToggle = document.getElementById('toggle-sound');

    function initAudio() {
        if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.22;
            masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('pointerdown', initAudio);
    soundToggle.addEventListener('change', initAudio);

    function tone(type, freq, dur, opts) {
        opts = opts || {};
        var t = audioCtx.currentTime + (opts.when || 0);
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (opts.slideTo) o.frequency.exponentialRampToValueAtTime(opts.slideTo, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(opts.vol || 0.3, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(masterGain);
        o.start(t); o.stop(t + dur + 0.03);
    }

    function play(kind) {
        if (!audioCtx || !soundToggle.checked) return;
        if (kind === 'select')      tone('sine', 680, 0.05, { vol: 0.14 });
        else if (kind === 'place')  tone('triangle', 330, 0.09, { vol: 0.24, slideTo: 180 });
        else if (kind === 'lock') { tone('sine', 740, 0.5, { vol: 0.34 }); tone('sine', 1108, 0.5, { vol: 0.18, when: 0.04 }); }
        else if (kind === 'over')   tone('sawtooth', 150, 0.28, { vol: 0.26, slideTo: 70 });
        else if (kind === 'undo')   tone('sine', 420, 0.08, { vol: 0.16, slideTo: 560 });
        else if (kind === 'win')    [523, 659, 784, 1046, 1319].forEach(function (f, i) { tone('triangle', f, 0.5, { vol: 0.26, when: i * 0.11 }); });
    }

    /* ================= FX ================= */
    function burst(x, y, color) {
        if (reducedMotion) return;
        for (var i = 0; i < 14; i++) {
            (function () {
                var s = document.createElement('div');
                s.className = 'spark';
                s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.background = color;
                document.body.appendChild(s);
                var ang = Math.random() * Math.PI * 2;
                var dist = 30 + Math.random() * 55;
                requestAnimationFrame(function () {
                    s.style.transform = 'translate(' + Math.cos(ang) * dist + 'px,' + Math.sin(ang) * dist + 'px) scale(0)';
                    s.style.opacity = '0';
                });
                setTimeout(function () { s.remove(); }, 680);
            })();
        }
    }

    function confetti() {
        if (reducedMotion) return;
        var colors = ['#ffeb3b', '#ff4081', '#00e5ff', '#66bb6a', '#ab47bc', '#ffa726'];
        for (var i = 0; i < 80; i++) {
            var c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.background = colors[i % colors.length];
            c.style.animationDelay = (Math.random() * 0.6) + 's';
            document.body.appendChild(c);
            (function (el) { setTimeout(function () { el.remove(); }, 3400); })(c);
        }
    }

    /* ================= HELPERS ================= */
    var rand = function (a, b) { return a + Math.floor(Math.random() * (b - a + 1)); };
    function sumArr(a) { return a.reduce(function (s, x) { return s + x; }, 0); }
    function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
    }
    function partition(n) {
        var out = [];
        while (n > 0) { var v = rand(1, Math.min(6, n)); out.push(v); n -= v; }
        return out;
    }
    function pickIndex(arr, pred) {
        var idx = [];
        for (var i = 0; i < arr.length; i++) if (pred(arr[i], i)) idx.push(i);
        return idx.length ? idx[Math.floor(Math.random() * idx.length)] : -1;
    }

    /* ================= LEVEL GENERATION (backward) ================= */
    function savedLevel() {
        try { return Math.max(1, parseInt(localStorage.getItem('skyline_level'), 10) || 1); }
        catch (e) { return 1; }
    }
    function saveLevel(n) { try { localStorage.setItem('skyline_level', n); } catch (e) {} }

    function genLevel(level) {
        var N = level < 3 ? 3 : (level < 5 ? 4 : 5);
        var T = Math.min(12, 4 + level);
        var depth = Math.min(9, 1 + level);

        // 1. solved state: each tower a partition of T, balls tagged with their home tower
        var towers = [];
        for (var i = 0; i < N; i++) {
            towers.push(partition(T).map(function (v) { return { v: v, home: i }; }));
        }

        // 2. scramble backward with single-ball moves (guarantees solvability).
        //    Never let a tower exceed the in-game cap, so the start state is
        //    always inside the frame and inside the rules.
        var tsum = function (t) { return t.reduce(function (s, b) { return s + b.v; }, 0); };
        var applied = 0, guard = 0;
        while (applied < depth && guard < depth * 60) {
            guard++;
            var from = pickIndex(towers, function (t) { return t.length > 0; });
            if (from < 0) break;
            var bi = Math.floor(Math.random() * towers[from].length);
            var ball = towers[from][bi];
            var to = pickIndex(towers, function (t, k) {
                return k !== from && tsum(t) + ball.v <= T + OVER_CAP;
            });
            if (to < 0) continue;
            towers[to].push(towers[from].splice(bi, 1)[0]);
            applied++;
        }

        // 3. par = number of balls now away from home (= optimal solution length)
        var par = 0;
        towers.forEach(function (t, ti) { t.forEach(function (b) { if (b.home !== ti) par++; }); });
        if (par === 0) {
            var s = pickIndex(towers, function (t) { return t.length > 1; });
            if (s < 0) s = pickIndex(towers, function (t) { return t.length > 0; });
            if (s >= 0) { towers[(s + 1) % N].push(towers[s].pop()); par = 1; }
        }

        towers.forEach(shuffle);
        return { T: T, par: par, towers: towers.map(function (t) { return t.map(function (b) { return b.v; }); }) };
    }

    /* ================= STATE ================= */
    var skyline = document.getElementById('skyline');
    var winScreen = document.getElementById('win-screen');

    var state = null;
    var towerNodes = [], stackNodes = [], hintNodes = [];
    var selected = null;
    var gesture = null;
    var containerGesture = null;
    var currentHighlight = null;

    /* ================= BUILD ================= */
    function makePiece(val) {
        var p = document.createElement('div');
        p.className = 'piece v' + val;
        p.dataset.val = val;
        p.style.setProperty('--val', val);
        p.textContent = val;
        p.addEventListener('pointerdown', function (e) { onPiecePointerDown(e, p); });
        return p;
    }

    function buildLevel(level, blueprint) {
        var bp = blueprint || genLevel(level);
        state = {
            level: level, N: bp.towers.length, target: bp.T, par: bp.par,
            moves: 0, won: false, busy: 0, history: [], blueprint: bp, towers: []
        };

        document.documentElement.style.setProperty('--target', bp.T);
        document.getElementById('target-line-label').textContent = bp.T;

        skyline.querySelectorAll('.tower').forEach(function (n) { n.remove(); });
        towerNodes = []; stackNodes = []; hintNodes = [];

        bp.towers.forEach(function (vals, i) {
            var tower = document.createElement('div');
            tower.className = 'tower';
            tower.dataset.drop = 'tower';
            tower.dataset.tower = i;
            tower.innerHTML =
                '<div class="tower-hint" id="hint-' + i + '"></div>' +
                '<div class="stack" id="stack-' + i + '"></div>' +
                '<div class="tower-base"></div>';
            skyline.appendChild(tower);
            wireDrop(tower);

            var stack = tower.querySelector('.stack');
            vals.forEach(function (v) { stack.appendChild(makePiece(v)); });

            towerNodes.push(tower);
            stackNodes.push(stack);
            hintNodes.push(tower.querySelector('.tower-hint'));
            state.towers.push({ sum: 0, need: 0, wasOk: false, wasOver: false });
        });

        setSelected(null);
        winScreen.classList.remove('show');
        computeUnit();
        recalc({ fx: false });
        updateHud();
        requestAnimationFrame(function () { computeUnit(); recalc({ measureOnly: true }); });
    }

    function computeUnit() {
        // reserve 12px for the base and 26px of headroom above a fully-capped
        // tower (target + OVER_CAP tall) so nothing can climb out of the frame
        var usable = skyline.clientHeight - 12 - 26;
        var u = Math.floor(usable / (state.target + OVER_CAP));
        u = Math.max(9, Math.min(22, u));
        document.documentElement.style.setProperty('--unit', u + 'px');
    }

    function updateHud() {
        document.getElementById('level-num').textContent = state.level;
        document.getElementById('target-num').textContent = state.target;
        document.getElementById('move-num').textContent = state.moves;
        document.getElementById('par-num').textContent = 'par ' + state.par;
        document.getElementById('btn-undo').disabled = state.history.length === 0 || state.won || state.busy > 0;
    }

    /* ================= RECALC ================= */
    function recalc(opts) {
        opts = opts || {};
        var measureOnly = !!opts.measureOnly;
        var fx = opts.fx !== false && !measureOnly;
        var allPerfect = true;

        state.towers.forEach(function (tw, i) {
            var sum = 0;
            stackNodes[i].querySelectorAll('.piece').forEach(function (p) { sum += +p.dataset.val; });
            tw.sum = sum;
            tw.need = state.target - sum;
            renderHint(i);

            if (measureOnly) return;

            var over = tw.need < 0;
            var ok = tw.need === 0;
            if (fx) {
                if (ok && !tw.wasOk) perfectFx(i);
                if (over && !tw.wasOver) overFx(i);
            }
            tw.wasOk = ok;
            tw.wasOver = over;
            towerNodes[i].classList.toggle('perfect', ok);
            towerNodes[i].classList.toggle('over', over);
            if (!ok) allPerfect = false;
        });

        if (measureOnly) return;

        updateFitHints();
        if (fx && !state.won && allPerfect) win();
    }

    function renderHint(i) {
        var tw = state.towers[i];
        var icon, cls, delta;
        if (tw.need === 0) { icon = '✓'; cls = 'ok'; delta = ''; }
        else if (tw.need > 0) { icon = '⬆'; cls = 'under'; delta = '+' + tw.need; }
        else { icon = '⚡'; cls = 'over'; delta = '−' + (-tw.need); }
        hintNodes[i].className = 'tower-hint ' + cls;
        hintNodes[i].innerHTML =
            '<span class="row"><span class="hs">' + tw.sum + '</span><span class="ht">/' + state.target + '</span></span>' +
            '<span class="row">' + (delta ? '<span class="hd">' + delta + '</span>' : '') + '<span class="hi">' + icon + '</span></span>';
    }

    function perfectFx(i) {
        var r = stackNodes[i].getBoundingClientRect();
        burst(r.left + r.width / 2, r.top, '#ff4081');
        play('lock');
    }
    function overFx(i) {
        var t = towerNodes[i];
        t.classList.remove('wobble');
        void t.offsetWidth;
        t.classList.add('wobble');
        play('over');
    }

    function win() {
        state.won = true;
        saveLevel(state.level + 1);
        var stars = state.moves <= state.par ? 3 : (state.moves <= state.par + 3 ? 2 : 1);
        document.getElementById('win-stars').textContent =
            '★★★☆☆☆'.slice(3 - stars, 6 - stars);
        document.getElementById('win-detail').textContent =
            'Balanced in ' + state.moves + (state.moves === 1 ? ' move' : ' moves') + ' · par ' + state.par;
        winScreen.classList.add('show');
        updateHud();
        play('win');
        confetti();
    }

    /* ================= FIT HINTS (coupling made visible) ================= */
    function showFitHints(val, homeIdx) {
        state.towers.forEach(function (t, i) {
            var fit = i !== homeIdx && t.need === val;
            var fuse = i !== homeIdx && (t.sum + val) > state.target;
            towerNodes[i].classList.toggle('perfect-fit', fit);
            towerNodes[i].classList.toggle('would-fuse', fuse && !fit);
        });
    }
    function clearFitHints() {
        towerNodes.forEach(function (n) { n.classList.remove('perfect-fit', 'would-fuse'); });
    }
    function updateFitHints() {
        if (selected) showFitHints(+selected.dataset.val, towerIndexOf(selected));
        else if (gesture && gesture.moved) showFitHints(+gesture.piece.dataset.val, towerIndexOf(gesture.piece));
        else clearFitHints();
    }

    function towerIndexOf(el) {
        var t = el && el.closest('.tower');
        return t ? +t.dataset.tower : -1;
    }

    /* ================= SELECTION (tap) ================= */
    function setSelected(piece) {
        if (selected) selected.classList.remove('selected');
        selected = piece || null;
        if (selected) selected.classList.add('selected');
        updateFitHints();
    }

    function handlePieceTap(piece) {
        if (state.won) return;
        if (selected === piece) { setSelected(null); play('select'); return; }
        if (selected) {
            var drop = piece.parentElement.closest('[data-drop]');
            var moving = selected;
            setSelected(null);
            placePiece(moving, drop);
            return;
        }
        setSelected(piece);
        play('select');
    }

    /* ================= DRAG (pointer events) ================= */
    function onPiecePointerDown(e, piece) {
        if (gesture || state.won) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        initAudio();
        e.stopPropagation();
        gesture = { piece: piece, id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false, clone: null };
        try { piece.setPointerCapture(e.pointerId); } catch (err) {}
        piece.addEventListener('pointermove', onPiecePointerMove);
        piece.addEventListener('pointerup', onPiecePointerUp);
        piece.addEventListener('pointercancel', onPiecePointerUp);
    }

    function onPiecePointerMove(e) {
        if (!gesture) return;
        var dx = e.clientX - gesture.x0, dy = e.clientY - gesture.y0;
        if (!gesture.moved && Math.sqrt(dx * dx + dy * dy) > 8) {
            gesture.moved = true;
            setSelected(null);
            gesture.piece.classList.add('dragging');
            gesture.clone = spawnClone(gesture.piece);
            positionClone(e.clientX, e.clientY);
            showFitHints(+gesture.piece.dataset.val, towerIndexOf(gesture.piece));
        }
        if (gesture.moved) {
            e.preventDefault();
            positionClone(e.clientX, e.clientY);
            updateHighlight(e.clientX, e.clientY);
        }
    }

    function onPiecePointerUp(e) {
        if (!gesture) return;
        var g = gesture;
        gesture = null;
        g.piece.removeEventListener('pointermove', onPiecePointerMove);
        g.piece.removeEventListener('pointerup', onPiecePointerUp);
        g.piece.removeEventListener('pointercancel', onPiecePointerUp);
        try { g.piece.releasePointerCapture(g.id); } catch (err) {}
        clearHighlight();

        if (g.moved) {
            g.piece.classList.remove('dragging');
            clearFitHints();
            var under = e.type === 'pointercancel' ? null : document.elementFromPoint(e.clientX, e.clientY);
            var drop = under && under.closest('[data-drop]');
            if (drop) {
                placePiece(g.piece, drop, { fromClone: g.clone });
            } else if (g.clone) {
                snapBack(g.clone, g.piece);
            }
        } else {
            if (g.clone) g.clone.remove();
            handlePieceTap(g.piece);
        }
    }

    function spawnClone(piece) {
        var c = piece.cloneNode(true);
        c.className = 'piece drag-clone v' + piece.dataset.val;
        c.style.cssText = 'position:fixed;z-index:3000;pointer-events:none;margin:0;left:0;top:0;';
        document.body.appendChild(c);
        return c;
    }
    function positionClone(x, y) {
        if (gesture && gesture.clone) {
            gesture.clone.style.left = (x - 22) + 'px';
            gesture.clone.style.top = (y - 22) + 'px';
        }
    }
    function updateHighlight(x, y) {
        var under = document.elementFromPoint(x, y);
        var drop = under && under.closest('[data-drop]');
        if (drop === currentHighlight) return;
        if (currentHighlight) currentHighlight.classList.remove('drop-target');
        currentHighlight = drop || null;
        if (currentHighlight) currentHighlight.classList.add('drop-target');
    }
    function clearHighlight() {
        if (currentHighlight) currentHighlight.classList.remove('drop-target');
        currentHighlight = null;
    }
    function snapBack(clone, piece) {
        var r = piece.getBoundingClientRect();
        clone.style.transition = 'left .2s ease, top .2s ease';
        clone.style.left = (r.left + r.width / 2 - 22) + 'px';
        clone.style.top = (r.top + r.height / 2 - 22) + 'px';
        var done = function () { clone.remove(); };
        clone.addEventListener('transitionend', done, { once: true });
        setTimeout(done, 320);
    }

    function rejectMove(dropEl, fromClone, piece, wasTap) {
        var i = +dropEl.dataset.tower;
        towerNodes[i].classList.remove('reject');
        void towerNodes[i].offsetWidth;
        towerNodes[i].classList.add('reject');
        setTimeout(function () { towerNodes[i].classList.remove('reject'); }, 400);
        play('over');
        if (fromClone) snapBack(fromClone, piece);
        if (wasTap) setSelected(piece);
    }

    /* ================= PLACEMENT + FLY ================= */
    function placePiece(piece, dropEl, opts) {
        opts = opts || {};
        var fromClone = opts.fromClone || null;
        var fromIdx = towerIndexOf(piece);
        var toIdx = +dropEl.dataset.tower;
        var val = +piece.dataset.val;

        // never let a tower be pushed more than OVER_CAP above the line
        if (!opts.undo && toIdx !== fromIdx &&
            state.towers[toIdx].sum + val > state.target + OVER_CAP) {
            rejectMove(dropEl, fromClone, piece, !fromClone);
            return;
        }

        var counts = !opts.undo && fromIdx !== toIdx && fromIdx !== -1;
        var startRect = (fromClone || piece).getBoundingClientRect();

        dropEl.querySelector('.stack').appendChild(piece);

        if (counts) {
            state.moves++;
            state.history.push({ piece: piece, from: fromIdx });
        } else if (opts.undo) {
            state.moves = Math.max(0, state.moves - 1);
        }
        recalc({ measureOnly: true });
        updateHud();

        if (reducedMotion) {
            if (fromClone) fromClone.remove();
            recalc();
            play(opts.undo ? 'undo' : 'place');
            return;
        }

        var clone = fromClone;
        if (!clone) {
            clone = spawnClone(piece);
            clone.style.left = (startRect.left + startRect.width / 2 - 22) + 'px';
            clone.style.top = (startRect.top + startRect.height / 2 - 22) + 'px';
        }
        piece.style.visibility = 'hidden';
        state.busy++;
        updateHud();

        requestAnimationFrame(function () {
            var r = piece.getBoundingClientRect();
            clone.style.transition = 'left .24s cubic-bezier(.2,.85,.3,1), top .24s cubic-bezier(.2,.85,.3,1)';
            clone.style.left = (r.left + r.width / 2 - 22) + 'px';
            clone.style.top = (r.top + r.height / 2 - 22) + 'px';
            var finished = false;
            var finish = function () {
                if (finished) return;
                finished = true;
                clone.remove();
                piece.style.visibility = '';
                state.busy = Math.max(0, state.busy - 1);
                recalc();
                updateHud();
                play(opts.undo ? 'undo' : 'place');
            };
            clone.addEventListener('transitionend', finish);
            setTimeout(finish, 400);
        });
    }

    /* ================= CONTAINER TAP ================= */
    function wireDrop(el) {
        el.addEventListener('pointerdown', function (e) {
            if (gesture || state.won) return;
            if (e.target.closest('.piece')) return;
            containerGesture = { el: el, x: e.clientX, y: e.clientY };
        });
        el.addEventListener('pointerup', function (e) {
            if (!containerGesture || containerGesture.el !== el) { containerGesture = null; return; }
            var dx = e.clientX - containerGesture.x, dy = e.clientY - containerGesture.y;
            var moved = Math.sqrt(dx * dx + dy * dy) > 8;
            containerGesture = null;
            if (!moved && selected) {
                var moving = selected;
                setSelected(null);
                placePiece(moving, el);
            }
        });
    }

    /* ================= BUTTONS ================= */
    function undo() {
        if (state.busy || state.won || !state.history.length) return;
        var last = state.history.pop();
        placePiece(last.piece, towerNodes[last.from], { undo: true });
    }

    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-reset').addEventListener('click', function () {
        if (state.busy) return;
        buildLevel(state.level, state.blueprint);
    });
    document.getElementById('btn-retry').addEventListener('click', function () {
        buildLevel(state.level, state.blueprint);
    });
    document.getElementById('btn-next').addEventListener('click', function () {
        buildLevel(state.level + 1);
    });

    var resizeTimer;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(computeUnit, 150);
    });

    /* ================= LAUNCH ================= */
    buildLevel(savedLevel());
})();
</script>
</body>
</html>
