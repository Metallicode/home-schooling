<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Time Tank</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #050508; color: #fff;
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box; text-align: center;
        }
        
        h1 { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); margin: 0 0 5px 0; letter-spacing: 2px; font-size: 2.5rem;}
        p { font-size: 16px; color: #b2ebf2; margin: 0 0 30px 0;}

        /* --- THE TANK --- */
        .tank-container {
            width: 100%; max-width: 900px; background: #111; border: 4px solid #333;
            border-radius: 20px; padding: 10px; box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            position: relative; overflow: hidden; margin-bottom: 20px;
        }

        .tank-track {
            width: 100%; height: 80px; background: #0a0a0a; border-radius: 12px;
            position: relative; overflow: hidden;
        }

        .tank-fill {
            height: 100%; width: 0%; background: #00e5ff; border-radius: 10px;
            box-shadow: 0 0 20px #00e5ff, inset 0 0 15px rgba(255,255,255,0.5);
            /* NO CSS transition on width - we want JS to draw it every frame for ultra-smoothness */
        }

        /* The flashing warning when time is almost up */
        .warning-pulse {
            animation: pulseWarning 0.5s infinite alternate;
        }
        @keyframes pulseWarning {
            from { box-shadow: 0 0 20px #ff5252, inset 0 0 15px rgba(255,255,255,0.5); background: #ff5252;}
            to { box-shadow: 0 0 50px #ff5252, inset 0 0 30px rgba(255,255,255,0.8); background: #ff1744;}
        }

        /* --- READOUT --- */
        .time-readout {
            font-size: 64px; font-weight: bold; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.3);
            margin-bottom: 30px; font-variant-numeric: tabular-nums;
        }

        .time-decimals { font-size: 32px; color: #888; }

        /* --- CONTROLS --- */
        .controls {
            display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
            width: 100%; max-width: 900px;
        }

        .btn {
            background: #222; color: #fff; border: 2px solid #444; border-radius: 15px;
            padding: 20px 30px; font-size: 28px; font-family: inherit; font-weight: bold;
            cursor: pointer; transition: all 0.1s; flex: 1; min-width: 120px;
            box-shadow: 0 8px 0 #111; /* 3D Button effect */
        }
        .btn:hover { background: #333; transform: translateY(2px); box-shadow: 0 6px 0 #111; }
        .btn:active { transform: translateY(8px); box-shadow: 0 0 0 #111; }

        /* Color Code Buttons by magnitude */
        .btn-1 { color: #b388ff; border-color: #b388ff; }
        .btn-5 { color: #448aff; border-color: #448aff; }
        .btn-10 { color: #00e676; border-color: #00e676; }
        .btn-20 { color: #ffeb3b; border-color: #ffeb3b; }
        .btn-60 { color: #ff4081; border-color: #ff4081; }

        .btn-stop { background: #1a1a1a; color: #ff5252; border-color: #ff5252; width: 100%; max-width: 200px; margin-top: 20px; font-size: 20px; padding: 15px;}

        .toggle-container {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: #b388ff; font-weight: bold; cursor: pointer; margin-top: 30px;
        }
        .toggle-container input { width: 18px; height: 18px; accent-color: #b388ff; cursor: pointer; }

        .back-link {
            display: inline-block; margin-top: 30px; color: #00e5ff; text-decoration: none;
            font-size: 16px; border: 2px solid #00e5ff; border-radius: 50px; padding: 8px 20px;
            transition: all 0.15s ease;
        }
        .back-link:hover { background: #00e5ff; color: #050508; }

    </style>
</head>
<body>

    <h1>⏱️ The Time Tank ⏱️</h1>
    <p>Pump time into the tank. Watch it drain.</p>

    <div class="tank-container">
        <div class="tank-track">
            <div class="tank-fill" id="tank-fill"></div>
        </div>
    </div>

    <div class="time-readout">
        <span id="time-whole">00:00</span><span class="time-decimals" id="time-decimal">.00</span>
    </div>

    <div class="controls">
        <button class="btn btn-1" onclick="addTime(1)">+1s</button>
        <button class="btn btn-5" onclick="addTime(5)">+5s</button>
        <button class="btn btn-10" onclick="addTime(10)">+10s</button>
        <button class="btn btn-20" onclick="addTime(20)">+20s</button>
        <button class="btn btn-60" onclick="addTime(60)">+1m</button>
    </div>
    
    <button class="btn btn-stop" onclick="stopAndClear()">Drain Immediately</button>

    <label class="toggle-container">
        <input type="checkbox" id="toggle-sound" checked onchange="initAudio()">
        🎵 Enable Sound Effects
    </label>

    <br>
    <a class="back-link" href="index.html">← Back to Index</a>

<script>
    // --- STATE VARIABLES ---
    let timeRemaining = 0; // In seconds
    let capacity = 60; // The max scale of the bar in seconds (Defaults to 1 minute)
    let lastTimestamp = 0;
    let animationId = null;

    // --- DOM ELEMENTS ---
    const fillBar = document.getElementById('tank-fill');
    const timeWhole = document.getElementById('time-whole');
    const timeDecimal = document.getElementById('time-decimal');

    // --- AUDIO ENGINE ---
    let audioCtx;

    function initAudio() {
        if (document.getElementById('toggle-sound').checked && !audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type, magnitude = 1) {
        if (!audioCtx || !document.getElementById('toggle-sound').checked) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'add') {
            osc.type = 'sine';
            // Pitch goes up slightly based on how much time was added
            const baseFreq = 400 + (magnitude * 10); 
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(baseFreq + 200, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.4);
        } 
        else if (type === 'done') {
            // A gentle, glowing chord indicating time is up
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(349.23, audioCtx.currentTime); // F4
            
            let osc2 = audioCtx.createOscillator();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(440.00, audioCtx.currentTime); // A4
            osc2.connect(gain);
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);

            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 2.0);
            osc2.start(audioCtx.currentTime); osc2.stop(audioCtx.currentTime + 2.0);
        }
    }

    // --- CORE LOGIC ---
    function addTime(seconds) {
        initAudio(); // Wake up audio if this is the first click
        playSound('add', seconds);

        timeRemaining += seconds;

        // If she adds more time than the tank currently holds, expand the tank!
        if (timeRemaining > capacity) {
            capacity = timeRemaining; 
        }

        // If the tank wasn't running, start it
        if (!animationId) {
            lastTimestamp = performance.now();
            animationId = requestAnimationFrame(drainLoop);
        }

        updateUI(); // Immediate visual feedback before next frame
    }

    function stopAndClear() {
        timeRemaining = 0;
        updateUI();
    }

    // The high-precision engine loop
    function drainLoop(currentTimestamp) {
        // Calculate exactly how many seconds have passed since the last frame
        const deltaSeconds = (currentTimestamp - lastTimestamp) / 1000;
        lastTimestamp = currentTimestamp;

        timeRemaining -= deltaSeconds;

        if (timeRemaining <= 0) {
            // Time is up!
            timeRemaining = 0;
            cancelAnimationFrame(animationId);
            animationId = null;
            capacity = 60; // Reset the scale to 1 minute for the next run
            playSound('done');
            updateUI();
            return; // Stop the loop
        }

        updateUI();
        animationId = requestAnimationFrame(drainLoop); // Keep looping
    }

    // --- VISUAL RENDERING ---
    function updateUI() {
        // 1. Format the text (MM:SS.ms)
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = Math.floor(timeRemaining % 60);
        const milliseconds = Math.floor((timeRemaining % 1) * 100);

        const minStr = minutes.toString().padStart(2, '0');
        const secStr = seconds.toString().padStart(2, '0');
        const msStr = milliseconds.toString().padStart(2, '0');

        timeWhole.innerText = `${minStr}:${secStr}`;
        timeDecimal.innerText = `.${msStr}`;

        // 2. Update the Bar Width
        let percentage = (timeRemaining / capacity) * 100;
        percentage = Math.max(0, Math.min(100, percentage)); // Clamp between 0-100
        fillBar.style.width = `${percentage}%`;

        // 3. Dynamic Color Coding
        // We use HSL color to shift smoothly from Cyan (180) to Green (120) to Yellow (60) to Red (0)
        
        let hue;
        if (timeRemaining > 30) {
            hue = 180; // Neon Blue
            fillBar.classList.remove('warning-pulse');
        } else if (timeRemaining > 10) {
            // Shift smoothly from Green to Yellow as it drops from 30s to 10s
            hue = 120 - ((30 - timeRemaining) / 20) * 60;
            fillBar.classList.remove('warning-pulse');
        } else {
            // Below 10 seconds: Shift from Yellow to pure Red
            hue = 60 - ((10 - timeRemaining) / 10) * 60;
            
            // Add heartbeat flashing below 5 seconds
            if (timeRemaining <= 5 && timeRemaining > 0) {
                fillBar.classList.add('warning-pulse');
            } else {
                fillBar.classList.remove('warning-pulse');
            }
        }

        // Apply the calculated color
        if (timeRemaining > 0 && timeRemaining > 5) {
            fillBar.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
            fillBar.style.boxShadow = `0 0 20px hsl(${hue}, 100%, 50%), inset 0 0 15px rgba(255,255,255,0.5)`;
        }
        
        if (timeRemaining === 0) {
            fillBar.style.width = '0%';
            fillBar.classList.remove('warning-pulse');
        }
    }

    // Initial render
    updateUI();

</script>
</body>
</html>
